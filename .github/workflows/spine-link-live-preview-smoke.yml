name: Spine-Link live preview smoke

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Vercel deploy and alias"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  release_gate:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    outputs:
      deployed: ${{ steps.inspect.outputs.deployed }}
    steps:
      - name: Confirm upstream run performed a real production deployment
        id: inspect
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/jobs?per_page=100")"
          deployed="$(printf '%s' "$jobs" | jq -r '[.jobs[].steps[]? | select(.name == "Deploy to Vercel" and .conclusion == "success")] | length > 0')"
          echo "deployed=$deployed" >> "$GITHUB_OUTPUT"
          echo "VERIFIED_PRODUCTION_DEPLOY=$deployed"
  production-preview:
    needs: release_gate
    if: ${{ always() && (github.event_name != 'workflow_run' || needs.release_gate.outputs.deployed == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify real uploaded Spine pages and measure response times
        env:
          SITE: https://spine-link.vercel.app
        shell: bash
        run: |
          set -euo pipefail
          ids=(
            'spine-link-directcheck-2026-11-14T08-58-02-742Z'
            'spine-link-fastcheck-2026-11-14T08-50-04-803Z'
            'k_nuke-2026-11-13T08-34-56-151Z'
            'wolf-2026-11-20T05-12-56-813Z'
            'sabrinaBedSide-2026-11-20T07-06-45-002Z'
          )
          for id in "${ids[@]}"; do
            success=0
            for attempt in 1 2 3 4; do
              output="$(mktemp)"
              stats="$(curl --silent --show-error --location --max-time 45 --connect-timeout 10 -H 'Cache-Control: no-cache' --output "$output" --write-out '%{http_code} %{time_starttransfer} %{time_total}' "$SITE/p/$id" || true)"
              read -r http ttfb total <<< "$stats"
              echo "$id attempt=$attempt HTTP=${http:-none} TTFB=${ttfb:-?}s total=${total:-?}s"
              if [[ "$http" == 200 ]] && grep -Fq 'id="spine-preview-config"' "$output" && ! grep -Fxq 'Preview not found' "$output"; then
                echo "PASS: $SITE/p/$id"
                success=1
                rm -f "$output"
                break
              fi
              echo "Preview response snippet:"
              head -c 350 "$output" || true
              echo
              rm -f "$output"
              sleep 5
            done
            if [[ "$success" != 1 ]]; then
              echo "::error::Uploaded work $id did not render the Spine preview page"
              exit 1
            fi
          done
