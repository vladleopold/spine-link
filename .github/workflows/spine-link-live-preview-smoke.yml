name: Spine-Link live preview smoke

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Vercel deploy and alias"]
    types: [completed]

permissions:
  contents: read
  actions: read
  statuses: read

jobs:
  release_gate:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    outputs:
      deployed: ${{ steps.inspect.outputs.deployed }}
    steps:
      - name: Confirm upstream run performed a real production deployment
        id: inspect
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_FILE: spine-link-live-preview-smoke.yml
          SMOKE_JOB_NAME: production-preview
        run: |
          set -euo pipefail
          jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/jobs?per_page=100")"
          deployed="$(printf '%s' "$jobs" | jq -r '[.jobs[].steps[]? | select(.name == "Deploy to Vercel" and .conclusion == "success")] | length > 0')"
          if [ "$deployed" != "true" ]; then
            # Vercel's Git integration may finish production just after the
            # GitHub deploy workflow's cooldown-only skip.
            for attempt in $(seq 1 12); do
              status="$(gh api "repos/$GITHUB_REPOSITORY/commits/$DEPLOY_SHA/status" --jq '[.statuses[]? | select(.context == "Vercel" and .state == "success")][0] // empty' || true)"
              if [ -n "$status" ]; then deployed=true; break; fi
              sleep 15
            done
          fi
          if [ "$deployed" = "true" ]; then
            runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW_FILE/runs?per_page=100&branch=main")"
            candidate_ids="$(printf '%s' "$runs" | jq -r --arg sha "$DEPLOY_SHA" --arg current "$GITHUB_RUN_ID" '.workflow_runs[] | select(.head_sha == $sha and (.id|tostring) != $current and .event == "workflow_run" and .status == "completed" and .conclusion == "success") | .id')"
            already=false
            while IFS= read -r prior_id; do
              [ -z "$prior_id" ] && continue
              prior_jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$prior_id/jobs?per_page=100")"
              prior_success="$(printf '%s' "$prior_jobs" | jq -r --arg job "$SMOKE_JOB_NAME" '[.jobs[] | select(.name == $job and .conclusion == "success")] | length > 0')"
              if [ "$prior_success" = "true" ]; then already=true; break; fi
            done <<< "$candidate_ids"
            if [ "$already" = "true" ]; then deployed=false; fi
          fi
          echo "deployed=$deployed" >> "$GITHUB_OUTPUT"
          echo "VERIFIED_PRODUCTION_DEPLOY=$deployed"

  production-preview:
    needs: release_gate
    if: ${{ always() && (github.event_name != 'workflow_run' || needs.release_gate.outputs.deployed == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify real uploaded Spine pages and measure response times
        env:
          SITE: https://spine-link.vercel.app
        shell: bash
        run: |
          set -euo pipefail
          ids=(
            'spine-link-directcheck-2026-11-14T08-58-02-742Z'
            'spine-link-fastcheck-2026-11-14T08-50-04-803Z'
            'k_nuke-2026-11-13T08-34-56-151Z'
            'wolf-2026-11-20T05-12-56-813Z'
            'sabrinaBedSide-2026-11-20T07-06-45-002Z'
          )
          for id in "${ids[@]}"; do
            success=0
            for attempt in 1 2 3 4; do
              output="$(mktemp)"
              stats="$(curl --silent --show-error --location --max-time 45 --connect-timeout 10 -H 'Cache-Control: no-cache' --output "$output" --write-out '%{http_code} %{time_starttransfer} %{time_total}' "$SITE/p/$id" || true)"
              read -r http ttfb total <<< "$stats"
              echo "$id attempt=$attempt HTTP=${http:-none} TTFB=${ttfb:-?}s total=${total:-?}s"
              if [[ "$http" == 200 ]] && grep -Fq 'id="spine-preview-config"' "$output" && ! grep -Fxq 'Preview not found' "$output"; then
                echo "PASS: $SITE/p/$id"
                success=1
                rm -f "$output"
                break
              fi
              echo "Preview response snippet:"
              head -c 350 "$output" || true
              echo
              rm -f "$output"
              sleep 5
            done
            if [[ "$success" != 1 ]]; then
              echo "::error::Uploaded work $id did not render the Spine preview page"
              exit 1
            fi
          done
