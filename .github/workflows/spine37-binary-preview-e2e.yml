name: Spine 3.7 binary preview playback verification
on:
  push:
    branches:
      - fix/spine37-binary-via-38-runtime
    paths:
      - api/github-preview.js
      - lib/spine-runtime-file-selection.js
      - tests/spine-runtime-compatibility.test.mjs
      - tests/spine37-binary-runtime-compatibility.test.mjs
      - tests/preview-animation-identity.test.mjs
      - tests/spine37-binary-preview.e2e.mjs
      - .github/workflows/spine37-binary-preview-e2e.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    timeout-minutes: 18
    env:
      SITE: https://spine-link-git-fix-spine37-binary-via-38-runtime-team-3bf124fa.vercel.app
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run targeted runtime and preview regressions
        run: node --test tests/spine-runtime-compatibility.test.mjs tests/spine37-binary-runtime-compatibility.test.mjs tests/preview-animation-identity.test.mjs tests/work-page-video-preview.test.mjs
      - name: Build production bundle
        run: npm run build
      - name: Verify actual Spine 3.7 binary animation playback in branch deployment
        run: node tests/spine37-binary-preview.e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spine37-preview-evidence
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 3
