name: Source Proof Privacy Regression

on:
  pull_request:
    paths:
      - 'src/SpineApp.tsx'
      - 'api/github-upload.js'
      - 'lib/source-proof-privacy.js'
      - 'lib/source-proof-privacy.d.ts'
      - 'tests/source-proof-privacy.test.mjs'
      - 'public/spine-link-manifesto.html'
      - 'index.html'
      - 'public/spine-link.html'
      - 'public/llms.txt'
      - '.github/workflows/source-proof-privacy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-proof-privacy:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Source Proof privacy regression tests
        run: node --test tests/source-proof-privacy.test.mjs
      - name: Build site
        run: npm run build
