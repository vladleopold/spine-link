name: Homepage feed regression
on:
  push:
    paths: ['scripts/check-home-feed.mjs', '.github/workflows/check-home-feed.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.59.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/check-home-feed.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homepage-feed-screenshots
          path: home-feed-*.png
          retention-days: 7
