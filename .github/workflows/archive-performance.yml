name: Spine archive WebP-first performance regression
on:
  push:
    branches: [main, 'fix/archive-*']
  pull_request:
    paths:
      - api/github-archive.js
      - api/github-preview.js
      - api/github-upload.js
      - tests/preview-animation-identity.test.mjs
      - tests/animation-menu-scroll.test.mjs
      - tests/archive-speed.test.mjs
      - tests/archive-initial-timing.test.mjs
      - tests/no-animation-substitution.test.mjs
      - scripts/preview-animation-choice.mjs
      - scripts/spine-export-webm.mjs
      - scripts/lib/preview-export-status.cjs
      - scripts/lib/preview-work-path.cjs
      - src/SpineApp.tsx
      - lib/agent-animation.js
      - lib/spine-data-science.js
      - scripts/spine-project-cloud-export.mjs
      - .github/workflows/spine-export-full.yml
      - .github/workflows/archive-performance.yml
      - .github/workflows/vercel-deploy-and-alias.yml
      - .github/workflows/archive-live-speed.yml
      - .github/workflows/spine-link-browser-smoke.yml
      - .github/workflows/spine-link-upload-e2e.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check API and client syntax, WebP-first and pagination contracts
        run: |
          node --check api/github-archive.js
          node --check api/github-preview.js
          node --check api/github-upload.js
          node --check scripts/spine-export-webm.mjs
          node --check scripts/lib/preview-export-status.cjs
          node --check scripts/lib/preview-work-path.cjs
          node --check scripts/spine-project-cloud-export.mjs
          node --check lib/agent-animation.js
          node --check lib/spine-data-science.js
          node --test tests/archive-speed.test.mjs tests/archive-initial-timing.test.mjs tests/preview-animation-identity.test.mjs tests/animation-menu-scroll.test.mjs tests/spine-runtime-file-selection.test.mjs tests/spine-atlas-integrity.test.mjs tests/no-animation-substitution.test.mjs
      - name: Install dependencies and build the browser app
        run: npm ci --no-audit --no-fund && npm run build
