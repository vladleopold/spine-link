name: Spine archive WebP-first performance regression
on:
  push:
    branches: [main, 'fix/archive-*']
    paths:
      - api/github-archive.js
      - api/github-preview.js
      - tests/preview-animation-identity.test.mjs
      - tests/animation-menu-scroll.test.mjs
      - tests/archive-speed.test.mjs
      - tests/preview-cache.test.mjs
      - lib/github-content-cache.js
      - tests/archive-initial-timing.test.mjs
      - tests/archive-exact-spine-export.test.mjs
      - scripts/spine-export-webm.mjs
      - scripts/preview-animation-choice.mjs
      - scripts/lib/source-set-choice.mjs
      - scripts/source-skeleton-choice.mjs
      - scripts/atlas-pages.mjs
      - scripts/lib/preview-work-path.cjs
      - scripts/lib/preview-export-status.cjs
      - .github/workflows/spine-export-full.yml
      - tests/spine-runtime-file-selection.test.mjs
      - tests/spine-atlas-integrity.test.mjs
      - tests/archive-exact-spine-export.test.mjs
      - scripts/spine-export-webm.mjs
      - scripts/preview-animation-choice.mjs
      - scripts/lib/source-set-choice.mjs
      - scripts/source-skeleton-choice.mjs
      - scripts/atlas-pages.mjs
      - scripts/lib/preview-work-path.cjs
      - scripts/lib/preview-export-status.cjs
      - .github/workflows/spine-export-full.yml
      - lib/spine-atlas-integrity.js
      - lib/spine-runtime-file-selection.js
      - api/github-preview.js
      - src/main.tsx
      - .github/workflows/archive-performance.yml
      - .github/workflows/vercel-deploy-and-alias.yml
      - .github/workflows/archive-live-speed.yml
      - .github/workflows/spine-link-live-preview-smoke.yml
      - .github/workflows/spine-link-browser-smoke.yml
  pull_request:
    paths:
      - api/github-archive.js
      - api/github-preview.js
      - tests/preview-animation-identity.test.mjs
      - tests/animation-menu-scroll.test.mjs
      - tests/archive-speed.test.mjs
      - tests/preview-cache.test.mjs
      - lib/github-content-cache.js
      - tests/archive-initial-timing.test.mjs
      - .github/workflows/archive-performance.yml
      - .github/workflows/vercel-deploy-and-alias.yml
      - .github/workflows/archive-live-speed.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check API and client syntax, WebP-first and pagination contracts
        run: |
          node --check api/github-archive.js
          node --check api/github-preview.js
          node --check scripts/spine-export-webm.mjs
          node --test tests/preview-cache.test.mjs tests/archive-speed.test.mjs tests/archive-initial-timing.test.mjs tests/preview-animation-identity.test.mjs tests/animation-menu-scroll.test.mjs tests/spine-runtime-file-selection.test.mjs tests/spine-atlas-integrity.test.mjs tests/archive-exact-spine-export.test.mjs
