name: Spine project chooser Chromium end-to-end
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/spine-project-browser-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  project-folder-ui:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Drag Spine project and images folder together, open uploaded page, remove test
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {chromium} from 'playwright';
          fs.mkdirSync('/tmp/spine-project-e2e/images',{recursive:true});
          fs.copyFileSync('test/anim1/fool_demo_fx.png','/tmp/spine-project-e2e/images/texture.png');
          const browser=await chromium.launch({headless:true,args:['--use-gl=angle','--use-angle=swiftshader']});
          const site='https://spine-link.vercel.app';
          let id='', account=null, checked=false;
          const start=Date.now();
          try{
            const page=await browser.newPage({viewport:{width:1200,height:820}});
            const pageErrors=[];
            page.on('pageerror',error=>pageErrors.push(String(error)));
            await page.goto(site+'/',{waitUntil:'domcontentloaded',timeout:60000});
            await page.locator('#home-drop-zone').waitFor();
            assert.equal(await page.locator('[data-pick-spine-project], [data-pick-spine-images]').count(),0);
            assert.equal(await page.locator('[data-file-input]').getAttribute('accept')?.includes('.spine'),true);
            const project=fs.readFileSync('test/anim4/spine.spine').toString('base64');
            const texture=fs.readFileSync('/tmp/spine-project-e2e/images/texture.png').toString('base64');
            await page.evaluate(({project,texture})=>{
              const bytes=value=>Uint8Array.from(atob(value),char=>char.charCodeAt(0));
              const source=new File([bytes(project)],'spine.spine',{type:'application/octet-stream'});
              const image=new File([bytes(texture)],'texture.png',{type:'image/png'});
              const transfer=new DataTransfer();
              transfer.items.add(source);
              transfer.items.add(image);
              const sourceEntry={name:'spine.spine',isFile:true,file(done){done(source)}};
              const imageEntry={name:'texture.png',isFile:true,file(done){done(image)}};
              const imagesEntry={name:'images',isDirectory:true,createReader(){
                let page=0;
                return {readEntries(done){done(page++===0?[imageEntry]:[])}};
              }};
              Object.defineProperty(transfer.items[0],'webkitGetAsEntry',{configurable:true,value:()=>sourceEntry});
              Object.defineProperty(transfer.items[1],'webkitGetAsEntry',{configurable:true,value:()=>imagesEntry});
              const zone=document.querySelector('#home-drop-zone');
              if(!zone)throw new Error('Missing drop zone');
              zone.dispatchEvent(new DragEvent('drop',{bubbles:true,cancelable:true,dataTransfer:transfer}));
            },{project,texture});
            await page.waitForURL(/\/p\/[^/]+/,{timeout:110000});
            id=new URL(page.url()).pathname.split('/').at(-1);
            account=JSON.parse(await page.evaluate(()=>localStorage.getItem('spine-link-anonymous-account')||'null'));
            assert.ok(id.startsWith('spine-'));
            assert.ok(account?.id);
            const body=await page.locator('body').innerText();
            assert.ok(body.includes('Spine Editor 4.3.26 export')||body.includes('licensed Spine Editor'),body.slice(0,260));
            assert.equal(body.includes('Preview not found'),false);
            assert.deepEqual(pageErrors,[]);
            console.log('PASS browser selected actual .spine project and images directory; page rendered');
            console.log('Browser start-to-page: '+((Date.now()-start)/1000).toFixed(2)+'s');
            checked=true;
          }finally{
            await browser.close();
            if(id&&account){
              const body={action:'delete-entry',entryId:id,anonymousAccount:account,
                settings:{owner:'vladleopold',repo:'spine',branch:'main',basePath:''}};
              const res=await fetch(site+'/api/github-upload',{
                method:'POST',headers:{'Content-Type':'application/json'},
                body:JSON.stringify(body),signal:AbortSignal.timeout(90000)});
              const response=await res.json().catch(()=>({}));
              if(!res.ok||response.deleted!==id){
                console.error('WARNING: failed to delete test project',res.status,response.error);
              }else console.log('PASS browser test project and images removed from server');
            }
          }
          assert.equal(checked,true);
          NODE
