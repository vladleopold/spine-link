name: Spine project automatic Drag and Drop UI
on:
  pull_request:
    paths:
      - 'src/main.tsx'
      - 'public/drop-handoff.js'
      - 'src/SpineApp.tsx'
      - 'src/spine-project-import.js'
      - 'src/spine-project-import.css'
      - 'src/styles.css'
      - 'tests/spine-project-import.test.mjs'
      - '.github/workflows/spine-project-browser-e2e.yml'
  push:
    branches: [main]
    paths:
      - 'src/main.tsx'
      - 'public/drop-handoff.js'
      - 'src/SpineApp.tsx'
      - 'src/spine-project-import.js'
      - 'src/spine-project-import.css'
      - 'src/styles.css'
      - 'tests/spine-project-import.test.mjs'
      - '.github/workflows/spine-project-browser-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  project-folder-ui:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build and project importer unit tests
        run: |
          npm run build
          node --test tests/spine-project-import.test.mjs
      - name: Check combined source and folder Drag and Drop in browser
        shell: bash
        run: |
          set -euo pipefail
          npx vite --host 127.0.0.1 --port 4173 > /tmp/spine-vite.log 2>&1 &
          trap 'kill $! 2>/dev/null || true' EXIT
          # Chromium must not race the Vite listener on slower Actions hosts.
          node --input-type=module <<'READY'
          let ready=false;
          for(let i=0;i<100;i++){
            try{
              const response=await fetch('http://127.0.0.1:4173/',{signal:AbortSignal.timeout(700)});
              if(response.ok){ready=true;break;}
            }catch{}
            await new Promise(resolve=>setTimeout(resolve,150));
          }
          if(!ready)throw Error('Vite did not become ready on 127.0.0.1:4173');
          READY
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true,args:['--use-gl=angle','--use-angle=swiftshader']});
          try {
            for (const viewport of [{width:1280,height:800},{width:390,height:844}]) {
              const page = await browser.newPage({viewport});
              const errors = [];
              const stagePaths = [];
              page.on('pageerror',error=>errors.push(String(error)));
              await page.route('**/api/github-archive?feed=home',route=>route.fulfill({status:200,contentType:'application/json',body:'{"entries":[]}'}));
              // Never publish test files. Verify the exact outgoing upload paths,
              // and return a terminal client error to stop the transfer.
              await page.route('**/api/github-upload',async route=>{
                const request=route.request();
                let payload={};
                try {payload=JSON.parse(request.postData()||'{}');} catch {}
                if(payload.action==='stage-blob')stagePaths.push(String(payload.path||''));
                await route.fulfill({status:422,contentType:'application/json',body:'{"error":"Test stub: publishing disabled"}'});
              });
              await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded',timeout:45000});
              await page.locator('#home-drop-zone').waitFor();
              assert.equal(await page.locator('[data-pick-spine-project], [data-pick-spine-images], .project-import-controls').count(),0);
              const reel=page.locator('.top-actions-row > a.world-archive-link[href="/world-spine-archive"]');
              assert.equal(await reel.count(),1,'Reel button is present');
              assert.equal((await reel.innerText()).trim(),'Reel');
              const reelBox=await reel.boundingBox();
              assert.ok(reelBox && reelBox.x>=0 && reelBox.x+reelBox.width<=viewport.width+1,
                'Reel button fits viewport at '+viewport.width);
              assert.equal(await page.locator('.site-menu-panel a[href="/api-keys.html"]').count(),1);
              assert.equal(await page.locator('.site-menu-panel a[href="/api-docs.html"]').count(),1);
              assert.equal(await page.locator('.site-menu-panel a[href="/world-spine-archive"]').count(),1);
              assert.match(await page.locator('#home-drop-zone').innerText(),/\.spine \+ images\//);
              assert.ok((await page.locator('[data-file-input]').getAttribute('accept')).includes('.spine'));
              // A selected .spine SOURCE must turn the same native file picker
              // into an images/ DIRECTORY picker: no extra page-level buttons.
              await page.locator('[data-file-input]').setInputFiles({
                name:'hero.spine', mimeType:'application/octet-stream',
                buffer:Buffer.from('SPINE'),
              });
              await page.waitForFunction(() =>
                document.querySelector('[data-file-input]')?.hasAttribute('webkitdirectory')
              );
              assert.equal(await page.locator('[data-file-input]').getAttribute('accept'),'');
              assert.match(await page.locator('[data-file-input]').getAttribute('aria-label'),/images folder/);
              // Reset to a fresh homepage and verify ordinary runtime picker is restored.
              await page.reload({waitUntil:'domcontentloaded'});
              await page.locator('#home-drop-zone').waitFor();
              assert.equal(await page.locator('[data-file-input]').getAttribute('webkitdirectory'),null);
              assert.ok((await page.locator('[data-file-input]').getAttribute('accept')).includes('.spine'));
              await page.locator('.site-menu-toggle').click();
              const menu=await page.locator('.site-menu-panel').boundingBox();
              assert.ok(menu && menu.x>=0 && menu.x+menu.width<=viewport.width+1,
                'Site menu fits viewport at '+viewport.width);
              await page.locator('.site-menu-toggle').click();
              await page.evaluate(()=>{
                const source = new File([new Uint8Array([83,80,73,78,69])],'hero.spine');
                const image = new File([new Uint8Array([137,80,78,71])],'texture.png');
                const sourceEntry = {name:'hero.spine',isFile:true,file(done){done(source)}};
                const imageEntry = {name:'texture.png',isFile:true,file(done){done(image)}};
                const imagesEntry = {name:'images',isDirectory:true,createReader(){
                  let page=0;
                  return {readEntries(done){done(page++===0?[imageEntry]:[])}};
                }};
                const evt = new Event('drop',{bubbles:true,cancelable:true});
                Object.defineProperty(evt,'dataTransfer',{value:{
                  types:['Files'],files:[source,image],items:[
                    {kind:'file',webkitGetAsEntry:()=>sourceEntry},
                    {kind:'file',webkitGetAsEntry:()=>imagesEntry},
                  ],
                }});
                const zone=document.querySelector('#home-drop-zone');
                if(!zone)throw new Error('Drop zone missing');
                zone.dispatchEvent(evt);
              });
              // Both stage requests must arrive; the mocked endpoint rejects
              // publication, so this never creates or deletes real user data.
              for(let retry=0;retry<40 && stagePaths.length<2;retry++){
                await page.waitForTimeout(250);
              }
              assert.ok(stagePaths.some(p=>/\/hero\.spine$/.test(p)),JSON.stringify(stagePaths));
              assert.ok(stagePaths.some(p=>/\/images\/texture\.png$/.test(p)),JSON.stringify(stagePaths));
              assert.deepEqual(errors,[]);
              await page.close();
              console.log('PASS', viewport.width, 'px: menu, drop copy, .spine + images/ automatic routing');
            }
            // Regression: a drop on a server-rendered page must retain nested
            // images/ paths through Cache API handoff and navigation.
            const staticPage = await browser.newPage({viewport:{width:1280,height:800}});
            const handoffPaths = [];
            const handoffErrors = [];
            staticPage.on('pageerror', error=>handoffErrors.push(String(error)));
            await staticPage.route('**/api/github-archive?feed=home',route=>route.fulfill({
              status:200,contentType:'application/json',body:'{"entries":[]}'
            }));
            await staticPage.route('**/api/github-upload',async route=>{
              let payload={};
              try{payload=JSON.parse(route.request().postData()||'{}');}catch{}
              if(payload.action==='stage-blob')handoffPaths.push(String(payload.path||''));
              await route.fulfill({status:422,contentType:'application/json',
                body:'{"error":"Test stub: publishing disabled"}'});
            });
            await staticPage.goto('http://127.0.0.1:4173/spine-link.html',{waitUntil:'domcontentloaded'});
            await staticPage.addScriptTag({url:'/drop-handoff.js'});
            await staticPage.evaluate(()=>{
              const source=new File(['spine source'],'hero.spine');
              const atlas=new File(['png bytes'],'tex.png',{type:'image/png'});
              const rootTexture=new File(['png bytes'],'root.png',{type:'image/png'});
              const asFile=(file)=>({name:file.name,isFile:true,file(done){done(file);}});
              const asDirectory=(name,batches)=>({name,isDirectory:true,createReader(){
                let index=0;return {readEntries(done){done(batches[index++]||[]);}};
              }});
              const nested=asDirectory('sub',[[asFile(atlas)],[]]);
              const images=asDirectory('images',[[asFile(rootTexture)],[nested],[]]);
              const evt=new Event('drop',{bubbles:true,cancelable:true});
              Object.defineProperty(evt,'dataTransfer',{value:{
                types:['Files'],files:[source],items:[
                  {kind:'file',webkitGetAsEntry:()=>asFile(source)},
                  {kind:'file',webkitGetAsEntry:()=>images}
                ]
              }});
              document.dispatchEvent(evt);
            });
            await staticPage.waitForURL(/restored=1/,{timeout:15000});
            for(let retry=0;retry<60 && handoffPaths.length<3;retry++)
              await staticPage.waitForTimeout(250);
            assert.ok(handoffPaths.some(p=>p.endsWith('/hero.spine')),JSON.stringify(handoffPaths));
            assert.ok(handoffPaths.some(p=>p.endsWith('/images/root.png')),JSON.stringify(handoffPaths));
            assert.ok(handoffPaths.some(p=>p.endsWith('/images/sub/tex.png')),JSON.stringify(handoffPaths));
            assert.deepEqual(handoffErrors,[]);
            await staticPage.close();
            console.log('PASS static page Drop handoff with paginated nested images/ paths');
          } finally {await browser.close();}
          NODE
