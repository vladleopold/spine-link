name: Spine-Link Agent API CI

on:
  push:
    branches: [main]
    paths:
      - 'api/github-upload.js'
      - 'lib/agent-animation.js'
      - 'lib/agent-user-keys.js'
      - 'public/api-keys.html'
      - 'public/api-keys.js'
      - 'public/sdk/spine-link-agent.mjs'
      - 'public/api-docs.html'
      - 'public/sdk.html'
      - 'src/main.tsx'
      - 'src/SpineApp.tsx'
      - 'tests/agent-api-pages.test.mjs'
      - 'tests/google-auth-guard.test.mjs'
      - 'tests/spine-link-agent-sdk.test.mjs'
      - 'tests/agent-animation-api.test.mjs'
      - 'scripts/spine-link-agent-publish.mjs'
      - 'docs/agent-animation-api.md'
      - 'vercel.json'
      - '.github/workflows/spine-link-agent-api.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent-api:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Agent API security and publishing regression tests
        run: node --test tests/agent-animation-api.test.mjs tests/spine-link-agent-sdk.test.mjs tests/agent-api-pages.test.mjs tests/google-auth-guard.test.mjs
      - name: Syntax check client and server
        run: |
          node --check lib/agent-user-keys.js
          node --check public/api-keys.js
          node --check lib/agent-animation.js
          node --check public/sdk/spine-link-agent.mjs
          node --check scripts/spine-link-agent-publish.mjs
      - name: Build site
        run: npm run build
      - name: Verify published static API pages
        run: |
          test -s dist/api-keys.html
          test -s dist/api-keys.js
          test -s dist/api-docs.html
          test -s dist/sdk.html
          test -s dist/sdk/spine-link-agent.mjs
          test -s dist/agent-animation-openapi.json
