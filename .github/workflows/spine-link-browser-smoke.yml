name: Spine-Link Chromium production verification

# Verify the actual public alias only after a successful production deployment.
# Manual dispatch remains available for diagnostics; PRs must not test stale production.
on:
  workflow_dispatch:
  # Run directly after runtime/player changes on main as well as after
  # the explicit Vercel release workflow. The chromium job waits for the
  # public production alias through its retrying page/asset checks.
  push:
    branches: [main]
    paths:
      - api/github-preview.js
      - lib/spine-runtime-file-selection.js
      - tests/spine37-binary-preview.e2e.mjs
      - .github/workflows/spine-link-browser-smoke.yml
  workflow_run:
    workflows: ["Vercel deploy and alias"]
    types: [completed]

permissions:
  contents: read
  actions: read
  statuses: write

jobs:
  release_gate:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    outputs:
      deployed: ${{ steps.inspect.outputs.deployed }}
    steps:
      - name: Confirm upstream run performed a real production deployment
        id: inspect
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_FILE: spine-link-browser-smoke.yml
          SMOKE_JOB_NAME: chromium
        run: |
          set -euo pipefail
          jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/jobs?per_page=100")"
          deployed="$(printf '%s' "$jobs" | jq -r '[.jobs[].steps[]? | select(.name == "Deploy to Vercel" and .conclusion == "success")] | length > 0')"
          if [ "$deployed" != "true" ]; then
            # Vercel's Git integration may finish production just after the
            # GitHub deploy workflow's cooldown-only skip.
            for attempt in $(seq 1 12); do
              status="$(gh api "repos/$GITHUB_REPOSITORY/commits/$DEPLOY_SHA/status" --jq '[.statuses[]? | select(.context == "Vercel" and .state == "success")][0] // empty' || true)"
              if [ -n "$status" ]; then deployed=true; break; fi
              sleep 15
            done
          fi
          if [ "$deployed" = "true" ]; then
            runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW_FILE/runs?per_page=100&branch=main")"
            candidate_ids="$(printf '%s' "$runs" | jq -r --arg sha "$DEPLOY_SHA" --arg current "$GITHUB_RUN_ID" '.workflow_runs[] | select(.head_sha == $sha and (.id|tostring) != $current and .event == "workflow_run" and .status == "completed" and .conclusion == "success") | .id')"
            already=false
            while IFS= read -r prior_id; do
              [ -z "$prior_id" ] && continue
              prior_jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$prior_id/jobs?per_page=100")"
              prior_success="$(printf '%s' "$prior_jobs" | jq -r --arg job "$SMOKE_JOB_NAME" '[.jobs[] | select(.name == $job and .conclusion == "success")] | length > 0')"
              if [ "$prior_success" = "true" ]; then already=true; break; fi
            done <<< "$candidate_ids"
            if [ "$already" = "true" ]; then deployed=false; fi
          fi
          echo "deployed=$deployed" >> "$GITHUB_OUTPUT"
          echo "VERIFIED_PRODUCTION_DEPLOY=$deployed"

  chromium:
    needs: release_gate
    if: ${{ always() && (github.event_name != 'workflow_run' || needs.release_gate.outputs.deployed == 'true') }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    timeout-minutes: 12
    env:
      SITE: https://spine-link.vercel.app
    steps:
      - uses: actions/checkout@v4
      - name: Install browser tooling
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify live homepage, real interactions, and a Spine preview
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { chromium } from 'playwright';

          const site = process.env.SITE;
          async function gotoWithRetry(targetPage, url, options) {
            let response = null;
            let lastError = '';
            for (let attempt = 0; attempt < 6; attempt++) {
              try {
                response = await targetPage.goto(url, options);
                if (response?.status() === 200) return response;
                lastError = 'HTTP ' + (response?.status() || 0);
              } catch (error) {
                lastError = String(error);
              }
              if (attempt < 5) {
                console.warn('RETRY PREVIEW', url, attempt + 1, lastError);
                await targetPage.waitForTimeout(Math.min(8000, 1000 * (2 ** attempt)));
              }
            }
            throw new Error('Preview route unavailable after 6 attempts: ' + url + ' (' + lastError + ')');
          }
          const browser = await chromium.launch({
            headless: true,
            args: ['--use-gl=angle', '--use-angle=swiftshader', '--enable-webgl'],
          });
          const failures = [];
          try {
            for (const viewport of [{width:1280,height:800},{width:390,height:844}]) {
              const page = await browser.newPage({ viewport, deviceScaleFactor: 1 });
              const pageErrors = [];
              const stagePaths = [];
              page.on('pageerror', error => pageErrors.push(String(error)));
              // Do not publish any data while testing live Drag & Drop.
              await page.route('**/api/github-upload', async route => {
                let payload = {};
                try { payload = JSON.parse(route.request().postData() || '{}'); } catch {}
                if (payload.action === 'stage-blob') stagePaths.push(String(payload.path || ''));
                await route.fulfill({
                  status: 422, contentType: 'application/json',
                  body: '{"error":"Production smoke test: upload intentionally blocked"}',
                });
              });
              try {
                const response = await page.goto(site + '/', {
                  waitUntil: 'domcontentloaded', timeout: 60000,
                });
                assert.equal(response?.status(), 200, 'Homepage HTTP status');
                await page.locator('#home-drop-zone').waitFor({state:'visible',timeout:40000});
                assert.equal(
                  await page.locator('[data-pick-spine-project], [data-pick-spine-images], .project-import-controls').count(),
                  0, 'Old separate upload buttons are back',
                );
                const reel = page.locator('.top-actions-row > a.world-archive-link[href="/world-spine-archive"]');
                assert.equal(await reel.count(), 1, 'Reel is missing from the homepage');
                const liveReelLabel = (await reel.innerText()).trim();
                // Pull requests test the currently deployed production alias,
                // which may still contain the old label. The PR's new UI is
                // checked by the local Chromium project-folder workflow.
                if (process.env.GITHUB_EVENT_NAME === 'pull_request') {
                  assert.ok(['Reel', 'Reel (browse)'].includes(liveReelLabel),
                    'Unexpected production header label: ' + liveReelLabel);
                } else {
                  assert.equal(liveReelLabel, 'Reel', 'Production must use the deployed new label');
                }
                const dropText = await page.locator('#home-drop-zone').innerText();
                assert.match(dropText, /\.spine\s*\+\s*images\//i,
                  'Drag & Drop must mention .spine + images/');
                const accepts = await page.locator('[data-file-input]').getAttribute('accept');
                assert.ok(accepts?.includes('.spine'), 'File picker does not accept .spine');
                await page.locator('.site-menu-toggle').click();
                const panel = page.locator('.site-menu-panel');
                for (const route of ['/api-keys.html', '/api-docs.html', '/world-spine-archive']) {
                  assert.equal(await panel.locator('a[href="' + route + '"]').count(), 1,
                    'Menu entry missing: ' + route);
                }
                const bounds = await panel.boundingBox();
                assert.ok(bounds && bounds.x >= -1 &&
                  bounds.x + bounds.width <= viewport.width + 1,
                  'Menu overflows viewport at ' + viewport.width);
                await page.locator('.site-menu-toggle').click();

                // Exercise the deployed JS drop handler with mocked network writes.
                await page.evaluate(() => {
                  const source = new File([new Uint8Array([83,80,73,78,69])], 'hero.spine');
                  const image = new File([new Uint8Array([137,80,78,71])], 'texture.png');
                  const sourceEntry = {name:'hero.spine',isFile:true,file(done){done(source)}};
                  const imageEntry = {name:'texture.png',isFile:true,file(done){done(image)}};
                  const imagesEntry = {name:'images',isDirectory:true,createReader(){
                    let page = 0;
                    return {readEntries(done){done(page++ === 0 ? [imageEntry] : [])}};
                  }};
                  const event = new Event('drop',{bubbles:true,cancelable:true});
                  Object.defineProperty(event,'dataTransfer',{value:{
                    types:['Files'], files:[source,image],
                    items:[
                      {kind:'file',webkitGetAsEntry:()=>sourceEntry},
                      {kind:'file',webkitGetAsEntry:()=>imagesEntry},
                    ],
                  }});
                  document.querySelector('#home-drop-zone').dispatchEvent(event);
                });
                for (let retry = 0; retry < 48 && stagePaths.length < 2; retry++) {
                  await page.waitForTimeout(250);
                }
                assert.ok(stagePaths.some(p => /\/hero\.spine$/.test(p)),
                  'Missing .spine stage request: ' + JSON.stringify(stagePaths));
                assert.ok(stagePaths.some(p => /\/images\/texture\.png$/.test(p)),
                  'Missing images/ stage request: ' + JSON.stringify(stagePaths));
                assert.deepEqual(pageErrors, [], 'Homepage JavaScript errors');
                console.log('PASS LIVE HOME', viewport.width, 'px, menu + .spine/images upload paths');
              } catch (error) {
                failures.push('Homepage ' + viewport.width + 'px: ' + String(error));
              } finally {
                await page.screenshot({
                  path: 'artifacts/home-' + viewport.width + '.png',
                  fullPage: true, timeout: 15000,
                }).catch(console.error);
                await page.close();
              }
            }

            const page = await browser.newPage({viewport:{width:1200,height:780}});
            const pageErrors = [];
            const missingAssets = [];
            page.on('pageerror', error => pageErrors.push(String(error)));
            page.on('response', response => {
              if (response.status() >= 400 &&
                  /\.(?:atlas|json|png|webp|skel)(?:\?|$)/i.test(response.url())) {
                missingAssets.push(response.status() + ' ' + response.url());
              }
            });
            try {
              const url = site + '/p/wolf-2026-11-20T05-12-56-813Z?animation=blow_loop_landscape';
              const response = await gotoWithRetry(page, url, {
                waitUntil: 'domcontentloaded', timeout: 60000,
              });
              assert.equal(response?.status(), 200, 'Spine preview HTTP status');
              await page.waitForFunction(() => {
                const player = document.querySelector('#player');
                return player && ['ready','blocked'].includes(player.dataset.previewStatus || '');
              }, null, {timeout:60000});
              const info = await page.evaluate(() => {
                const raw = document.querySelector('#spine-preview-config')?.textContent;
                const config = raw ? JSON.parse(raw) : {};
                const player = document.querySelector('#player');
                return {
                  sets: config.sets?.length || 0,
                  notFound: document.body.innerText.includes('Preview not found'),
                  canvas: document.querySelectorAll('canvas').length,
                  status: player?.dataset.previewStatus || '',
                  animation: player?.dataset.previewAnimation || '',
                  error: player?.dataset.previewError || '',
                };
              });
              assert.ok(info.sets > 0, 'Spine preview has no skeleton sets');
              assert.equal(info.notFound, false, 'Spine preview shows not found');
              assert.equal(info.status, 'ready', 'Spine Runtime did not become ready: ' + JSON.stringify(info));
              assert.equal(info.animation, 'blow_loop_landscape',
                'Requested initial Spine animation did not start: ' + JSON.stringify(info));
              // Long animation lists scroll internally, while all subsequent
              // sidebar cards stay below them; cover the >1000px breakpoint.
              for (const width of [1200, 1001]) {
                await page.setViewportSize({width, height:780});
                const layout = await page.evaluate(() => {
                  const menu = document.querySelector('#animation-menu');
                  const playerFrame = document.querySelector('.player-frame');
                  const followingSelectors = [
                    ['download', '#sidebar > .animation-download-block'],
                    ['video', '#sidebar > .video-watch-panel--below-list'],
                    ['proof', '#sidebar > .proof-card'],
                    ['owner-library', '#sidebar > #owner-library'],
                    ['set', '#sidebar > #set-card'],
                    ['notes', '#sidebar > .note-card'],
                  ];
                  if (!menu || !playerFrame) return null;
                  const originalChildren = Array.from(menu.childNodes);
                  const measure = (count) => {
                    const fragment = document.createDocumentFragment();
                    for (let i = 0; i < count; i++) {
                      const button = document.createElement('button');
                      button.type = 'button';
                      button.setAttribute('role', 'menuitem');
                      button.textContent = 'animation_' + i;
                      fragment.appendChild(button);
                    }
                    menu.replaceChildren(fragment);
                    const menuRect = menu.getBoundingClientRect();
                    const playerRect = playerFrame.getBoundingClientRect();
                    const following = followingSelectors.map(([name, selector]) => {
                      const element = document.querySelector(selector);
                      if (!element) return {name, present:false, visible:false, below:true};
                      const style = getComputedStyle(element);
                      const visible = style.display !== 'none' && style.visibility !== 'hidden' && element.getClientRects().length > 0;
                      if (!visible) return {name, present:true, visible:false, below:true};
                      const rect = element.getBoundingClientRect();
                      return {name, present:true, visible:true, top:Math.round(rect.top), below:rect.top >= menuRect.bottom - 1};
                    });
                    return {
                      height: menuRect.height,
                      playerHeight: playerRect.height,
                      maxHeight: getComputedStyle(menu).maxHeight,
                      scrollable: menu.scrollHeight > menu.clientHeight + 1,
                      following,
                    };
                  };
                  try {
                    return {few: measure(3), many: measure(26)};
                  } finally {
                    menu.replaceChildren(...originalChildren);
                  }
                });
                assert.ok(layout, 'Animation menu or following download card missing');
                assert.ok(layout.few.height < layout.few.playerHeight,
                  'Three animations must not fill the player at ' + width + 'px');
                assert.equal(layout.few.scrollable, false,
                  'Three animations must not scroll at ' + width + 'px');
                assert.equal(layout.many.maxHeight, Math.floor(layout.many.playerHeight) + 'px',
                  'Long animation menu max-height must track the actual player at ' + width + 'px: ' + JSON.stringify(layout.many));
                assert.ok(Math.abs(layout.many.height - layout.many.playerHeight) <= 1,
                  'Long animation menu must reach the actual player height at ' + width + 'px: ' + JSON.stringify(layout.many));
                assert.equal(layout.many.scrollable, true,
                  'Long animation list must scroll at ' + width + 'px');
                for (const state of [layout.few, layout.many]) {
                  const above = state.following.filter(item => item.visible && !item.below);
                  assert.deepEqual(above.map(item => item.name), [],
                    'Supporting sidebar sections overlap animation list at ' + width + 'px: ' + JSON.stringify(above));
                }
                console.log('PASS LIVE ANIMATION MENU', width, JSON.stringify(layout));
              }
              await page.setViewportSize({width:390,height:844});
              const mobileFlow = await page.evaluate(() => {
                const menu = document.querySelector('#animation-menu');
                if (!menu) return null;
                const menuRect = menu.getBoundingClientRect();
                const selectors = [
                  ['download', '#sidebar > .animation-download-block'],
                  ['video', '#sidebar > .video-watch-panel--below-list'],
                  ['proof', '#sidebar > .proof-card'],
                  ['owner-library', '#sidebar > #owner-library'],
                  ['set', '#sidebar > #set-card'],
                  ['notes', '#sidebar > .note-card'],
                ];
                const following = selectors.map(([name, selector]) => {
                  const element = document.querySelector(selector);
                  if (!element) return {name, visible:false, below:true};
                  const style = getComputedStyle(element);
                  const visible = style.display !== 'none' && style.visibility !== 'hidden' && element.getClientRects().length > 0;
                  if (!visible) return {name, visible:false, below:true};
                  return {name, visible:true, below:element.getBoundingClientRect().top >= menuRect.bottom - 1};
                });
                return {viewportWidth:innerWidth,scrollWidth:document.documentElement.scrollWidth,following};
              });
              assert.ok(mobileFlow, 'Mobile preview sidebar is missing');
              assert.ok(mobileFlow.scrollWidth <= mobileFlow.viewportWidth + 1,
                'Mobile preview has horizontal overflow: ' + JSON.stringify(mobileFlow));
              assert.deepEqual(mobileFlow.following.filter(item => item.visible && !item.below).map(item => item.name), [],
                'Mobile supporting sections overlap the animation menu: ' + JSON.stringify(mobileFlow));
              console.log('PASS LIVE MOBILE PREVIEW FLOW', JSON.stringify(mobileFlow));

              // Scroll retention is a desktop contract; restore desktop after the mobile-flow check.
              await page.setViewportSize({width:1200,height:780});
              // Select a late animation on first render, then change selections
              // without losing the user's current scroll position.
              const selectionScroll = await page.evaluate(() => {
                const menu = document.getElementById('animation-menu');
                const namesBefore = animationNames.value.slice();
                const activeBefore = activeAnimation.name;
                try {
                  animationNames.value = Array.from({length:60}, (_, index) => 'menu_test_' + index);
                  activeAnimation.name = 'menu_test_59';
                  menu.replaceChildren();
                  renderAnimationList();
                  const visible = () => {
                    const button = menu.querySelector('button.active');
                    const menuBox = menu.getBoundingClientRect();
                    const buttonBox = button.getBoundingClientRect();
                    return buttonBox.top >= menuBox.top - 1 && buttonBox.bottom <= menuBox.bottom + 1;
                  };
                  const firstSelectionVisible = visible();
                  const scrollRange = menu.scrollHeight - menu.clientHeight;
                  if (scrollRange <= 30) throw new Error('Synthetic list did not overflow: ' + JSON.stringify({items:menu.childElementCount,scrollHeight:menu.scrollHeight,clientHeight:menu.clientHeight}));
                  menu.scrollTop = menu.scrollHeight;
                  const nearBefore = menu.scrollTop;
                  activeAnimation.name = 'menu_test_58';
                  renderAnimationList();
                  const nearAfter = menu.scrollTop;
                  const nearSelectionVisible = visible();
                  activeAnimation.name = 'menu_test_0';
                  renderAnimationList();
                  const farAfter = menu.scrollTop;
                  const farSelectionVisible = visible();
                  return {firstSelectionVisible, nearBefore, nearAfter, nearSelectionVisible, farAfter, farSelectionVisible, scrollRange, items:menu.childElementCount, scrollHeight:menu.scrollHeight, clientHeight:menu.clientHeight};
                } finally {
                  animationNames.value = namesBefore;
                  activeAnimation.name = activeBefore;
                  renderAnimationList();
                }
              });
              assert.equal(selectionScroll.firstSelectionVisible, true,
                'Initial selected animation must be visible');
              assert.equal(selectionScroll.nearSelectionVisible, true,
                'Visible selected animation must remain visible');
              assert.ok(selectionScroll.nearBefore > 30 &&
                Math.abs(selectionScroll.nearBefore - selectionScroll.nearAfter) < 2,
                'Visible selection must preserve exact scroll position: ' + JSON.stringify(selectionScroll));
              assert.equal(selectionScroll.farSelectionVisible, true,
                'A newly selected off-screen animation must be revealed');
              assert.ok(selectionScroll.farAfter < selectionScroll.nearAfter - 30,
                'Off-screen active row did not adjust the menu scroll: ' + JSON.stringify(selectionScroll));
              console.log('PASS LIVE ANIMATION SCROLL AND ACTIVE VISIBILITY', JSON.stringify(selectionScroll));
              assert.deepEqual(missingAssets, [], 'Spine preview has missing assets');
              assert.deepEqual(pageErrors, [], 'Spine preview JavaScript errors');
              console.log('PASS LIVE PREVIEW', JSON.stringify(info));

              // Legacy Spine 2.1 is intentionally outside the Web Player
              // compatibility matrix. It must show an actionable re-export
              // message instead of leaking a generic player initialization error.
              const legacyPage = await browser.newPage({viewport:{width:1200,height:780}});
              try {
                const legacyResponse = await gotoWithRetry(
                  legacyPage,
                  site + '/p/Spine-animation-2026-11-24T01-25-27-944Z?animation=idleBattle',
                  {waitUntil:'domcontentloaded',timeout:60000},
                );
                assert.equal(legacyResponse?.status(), 200, 'Legacy Spine 2.1 preview HTTP status');
                await legacyPage.waitForFunction(() =>
                  document.querySelector('#player')?.dataset.previewStatus === 'blocked',
                  null, {timeout:15000});
                const legacy = await legacyPage.evaluate(() => ({
                  status:document.querySelector('#player')?.dataset.previewStatus || '',
                  error:document.querySelector('#player')?.dataset.previewError || '',
                  message:document.querySelector('#player')?.innerText || '',
                  animation:document.querySelector('#player')?.dataset.previewAnimation || '',
                }));
                assert.equal(legacy.status, 'blocked');
                assert.equal(legacy.error, 'UNSUPPORTED_SPINE_VERSION',
                  'Spine 2.1 must be blocked by the compatibility gate, not by a player initialization error: ' + JSON.stringify(legacy));
                assert.match(legacy.message, /Spine 2\.1\.27/);
                assert.match(legacy.message, /Re-export the original \.spine project/);
                assert.doesNotMatch(legacy.message, /^Spine preview is blocked\.$/);
                console.log('PASS ACTIONABLE LEGACY VERSION GATE', JSON.stringify(legacy));
              } finally {
                await legacyPage.close();
              }

              // Verify actual runtime initialization, exact animation selection,
              // and moving canvas pixels across every supported major/minor line.
              const playbackCases = [
                {label:'Spine 3.8.99 castle_upgrade', id:'castle_upgrade-2026-11-19T07-33-26-823Z', animation:'build'},
                {label:'Spine 4.0.58 restored archive', id:'276-Spine-2014--2026-10-24T21-46-51-258Z', animation:'idle'},
                {label:'Spine 4.1.24', id:'wolf-2026-11-20T05-12-56-813Z', animation:'blow_loop_landscape'},
                {label:'Spine 4.1 provenance restored', id:'wolf-2026-11-17T07-14-36-248Z', animation:'blow_in_landscape'},
                {label:'Spine 4.2.0 dryad diagnostic', id:'dryad-2026-09-30T21-54-03-321Z', animation:'walk'},
              ];
              for (const sample of playbackCases) {
                const playbackPage = await browser.newPage({viewport:{width:1200,height:780}});
                const playbackErrors = [];
                const playbackMissingAssets = [];
                const playbackConsoleErrors = [];
                playbackPage.on('pageerror', error => playbackErrors.push(String(error)));
                playbackPage.on('console', message => {
                  if (message.type() !== 'error') return;
                  const text = message.text();
                  // Ignore harmless favicon/optional-resource 404s. Required
                  // Spine assets are checked by the response listener below,
                  // and JavaScript exceptions are checked separately via pageerror.
                  if (!/Failed to load resource: the server responded with a status of 404/i.test(text)) {
                    playbackConsoleErrors.push(text);
                  }
                });
                const playbackHttpErrors = [];
                playbackPage.on('response', response => {
                  if (response.status() >= 400) {
                    playbackHttpErrors.push({status:response.status(),url:response.url()});
                  }
                });
                playbackPage.on('response', response => {
                  if (response.status() >= 400 &&
                      /\.(?:atlas|json|png|webp|skel)(?:\?|$)/i.test(response.url())) {
                    playbackMissingAssets.push(response.status() + ' ' + response.url());
                  }
                });
                try {
                  const playbackResponse = await gotoWithRetry(playbackPage, site + '/p/' + sample.id, {
                    waitUntil:'domcontentloaded', timeout:60000,
                  });
                  assert.equal(playbackResponse?.status(), 200, sample.label + ' preview HTTP status');
                  const playbackUrl = site + '/p/' + sample.id;
                  let assetDiagnostic = null;
                  let reachedTerminalState = false;
                  for (let attempt = 1; attempt <= 3; attempt++) {
                    if (attempt > 1) {
                      playbackErrors.length = 0;
                      playbackMissingAssets.length = 0;
                      playbackConsoleErrors.length = 0;
                      playbackHttpErrors.length = 0;
                      console.warn('RETRY SPINE PLAYBACK CONFIG', sample.label, attempt);
                      await playbackPage.waitForTimeout(attempt * 3000);
                      await gotoWithRetry(playbackPage, playbackUrl, {
                        waitUntil:'domcontentloaded', timeout:60000,
                      });
                    }
                    try {
                      assetDiagnostic = await playbackPage.evaluate(async () => {
                      const raw = document.querySelector('#spine-preview-config')?.textContent || '{}';
                      const config = JSON.parse(raw);
                      const set = config.sets?.[0] || {};
                      const jsonUrl = set.jsonUrl || set.skelUrl || set.skeleton || '';
                      const atlasUrl = set.atlasUrl || set.atlas || '';
                      let jsonStatus = 0, atlasStatus = 0, jsonData = null, jsonContentType = '';
                      if (jsonUrl) {
                        const response = await fetch(jsonUrl, {cache:'no-store'});
                        jsonStatus = response.status;
                        jsonContentType = response.headers.get('content-type') || '';
                        const body = await response.text();
                        try { jsonData = JSON.parse(body); } catch {}
                      }
                      if (atlasUrl) {
                        const response = await fetch(atlasUrl, {cache:'no-store'});
                        atlasStatus = response.status;
                      }
                      const boneNames = new Set((jsonData?.bones || []).map(bone => bone.name));
                      const missingSlotBones = (jsonData?.slots || [])
                        .filter(slot => !boneNames.has(slot.bone))
                        .map(slot => ({slot:slot.name,bone:slot.bone}));
                      return {
                        setKeys:Object.keys(set), jsonUrl, atlasUrl, jsonStatus, atlasStatus,
                        jsonContentType, jsonVersion:jsonData?.skeleton?.spine || '',
                        boneCount:jsonData?.bones?.length || 0, slotCount:jsonData?.slots?.length || 0,
                        missingSlotBones,
                        runtimeScriptUrls:performance.getEntriesByType('resource').map(x=>x.name).filter(x=>/spine-player\.js/.test(x)),
                      };
                      });
                    } catch (error) {
                      assetDiagnostic = {
                        setKeys:[], jsonUrl:'', atlasUrl:'', jsonStatus:0, atlasStatus:0,
                        jsonContentType:'', jsonVersion:'', boneCount:0, slotCount:0,
                        missingSlotBones:[], runtimeScriptUrls:[], diagnosticError:String(error),
                      };
                    }
                    reachedTerminalState = await playbackPage.waitForFunction(() => {
                      const player = document.querySelector('#player');
                      return player && ['ready','blocked'].includes(player.dataset.previewStatus || '');
                    }, null, {timeout:15000}).then(() => true).catch(() => false);
                    if (assetDiagnostic.setKeys.length > 0 &&
                        assetDiagnostic.jsonStatus === 200 &&
                        assetDiagnostic.atlasStatus === 200 &&
                        reachedTerminalState) break;
                    if (attempt < 3) {
                      console.warn('SPINE PLAYBACK NOT READY', sample.label, attempt, JSON.stringify({
                        setKeys:assetDiagnostic.setKeys,
                        jsonStatus:assetDiagnostic.jsonStatus,
                        atlasStatus:assetDiagnostic.atlasStatus,
                        reachedTerminalState,
                      }));
                    }
                  }
                  console.log('SPINE ASSET DIAGNOSTIC', sample.label, JSON.stringify(assetDiagnostic));
                  const beforeSelection = await playbackPage.evaluate(() => ({
                    status: document.querySelector('#player')?.dataset.previewStatus || '',
                    error: document.querySelector('#player')?.dataset.previewError || '',
                    runtimeText: document.querySelector('#player')?.innerText || '',
                    animationCount: document.querySelectorAll('#animation-menu button').length,
                  }));
                  if (!reachedTerminalState) {
                    failures.push(sample.label + ' Runtime stayed in loading state: ' +
                      JSON.stringify({beforeSelection,assetDiagnostic,playbackConsoleErrors,playbackMissingAssets,playbackErrors}));
                    continue;
                  }
                  assert.equal(beforeSelection.status, 'ready',
                    sample.label + ' Runtime must reach ready; got ' + JSON.stringify(beforeSelection));
                  assert.ok(beforeSelection.animationCount > 0,
                    sample.label + ' must expose its indexed animation list');
                  const clicked = await playbackPage.evaluate(name => {
                    const button = Array.from(document.querySelectorAll('#animation-menu button'))
                      .find(item => item.textContent.trim() === name);
                    if (!button) return false;
                    button.click();
                    return true;
                  }, sample.animation);
                  assert.equal(clicked, true, sample.label + ' missing exact animation ' + sample.animation);
                  await playbackPage.waitForFunction(name =>
                    document.querySelector('#player')?.dataset.previewAnimation === name,
                    sample.animation, {timeout:15000});
                  const canvas = playbackPage.locator('#player canvas').first();
                  await canvas.waitFor({state:'visible',timeout:15000});
                  const dimensions = await canvas.evaluate(element => ({width:element.width,height:element.height}));
                  assert.ok(dimensions.width > 100 && dimensions.height > 100,
                    sample.label + ' canvas has invalid dimensions: ' + JSON.stringify(dimensions));
                  const frameA = await canvas.screenshot();
                  await playbackPage.waitForTimeout(1200);
                  const frameB = await canvas.screenshot();
                  const hashA = createHash('sha256').update(frameA).digest('hex');
                  const hashB = createHash('sha256').update(frameB).digest('hex');
                  assert.notEqual(hashA, hashB,
                    sample.label + ' canvas pixels did not change while animation ' + sample.animation + ' was playing');
                  assert.deepEqual(playbackMissingAssets, [],
                    sample.label + ' missing Spine assets: ' + JSON.stringify(playbackMissingAssets));
                  assert.deepEqual(playbackErrors, [],
                    sample.label + ' JavaScript errors: ' + JSON.stringify(playbackErrors));
                  const relevantConsoleErrors = playbackConsoleErrors.filter(message =>
                    !/Failed to load resource:.*status of 404/.test(message));
                  if (relevantConsoleErrors.length !== playbackConsoleErrors.length) {
                    console.log('IGNORED NON-SPINE 404 CONSOLE MESSAGES', sample.label,
                      JSON.stringify(playbackConsoleErrors.filter(message => !relevantConsoleErrors.includes(message))));
                  }
                  assert.deepEqual(relevantConsoleErrors, [],
                    sample.label + ' relevant console errors: ' + JSON.stringify({console:relevantConsoleErrors,http:playbackHttpErrors}));
                  console.log('PASS REAL SPINE PLAYBACK', sample.label, sample.animation,
                    JSON.stringify({dimensions,hashA,hashB}));
                } catch (error) {
                  failures.push(sample.label + ': ' + String(error));
                } finally {
                  await playbackPage.screenshot({
                    path:'artifacts/playback-' + sample.id + '.png', fullPage:true, timeout:15000,
                  }).catch(console.error);
                  await playbackPage.close();
                }
              }

              // The restored legacy 4.0.58 record is included in the real runtime
              // matrix above; it must initialize and play its indexed idle track.

              // sabrinaBedSide was imported in the matching 3.8.75 editor and re-exported
              // with Spine 4.3.26. Verify the real production player and all original animations.
              const convertedPage = await browser.newPage({viewport:{width:1200,height:780}});
              const convertedErrors = [];
              convertedPage.on('pageerror', error => convertedErrors.push(String(error)));
              convertedPage.on('console', message => {
                if (message.type() === 'error') convertedErrors.push(message.text());
              });
              try {
                const convertedResponse = await gotoWithRetry(
                  convertedPage,
                  site + '/p/sabrinaBedSide-2026-11-20T07-06-45-002Z?animation=idle',
                  {waitUntil:'domcontentloaded',timeout:60000},
                );
                assert.equal(convertedResponse?.status(), 200, 'sabrinaBedSide converted preview HTTP status');
                await convertedPage.waitForFunction(() =>
                  document.querySelector('#player')?.dataset.previewStatus === 'ready',
                  null, {timeout:60000});
                const converted = await convertedPage.evaluate(() => ({
                  animation: document.querySelector('#player')?.dataset.previewAnimation || '',
                  animations: [...document.querySelectorAll('#animation-menu button')]
                    .map(button => button.textContent.trim()),
                  canvas: document.querySelectorAll('canvas').length,
                }));
                assert.equal(converted.animation, 'idle', 'sabrinaBedSide idle animation must be selected');
                assert.equal(converted.animations.length, 11, 'all 11 original animations must remain');
                assert.ok(converted.animations.includes('digesting_4_full'));
                assert.ok(converted.animations.includes('digesting_5_full'));
                assert.ok(converted.canvas > 0, 'converted skeleton must render a canvas');
                assert.deepEqual(convertedErrors, [],
                  'sabrinaBedSide converted player errors: ' + JSON.stringify(convertedErrors));
                console.log('PASS CONVERTED SPINE 3.8.75 -> 4.3.26',
                  JSON.stringify(converted));
              } catch (error) {
                failures.push('sabrinaBedSide converted 4.3.26 preview: ' + String(error));
              } finally {
                await convertedPage.screenshot({
                  path:'artifacts/playback-sabrinaBedSide-converted.png',fullPage:true,timeout:15000,
                }).catch(console.error);
                await convertedPage.close();
              }
            if (failures.length) {
              console.error('PRODUCTION BROWSER FAILURES:\n' + failures.join('\n'));
              process.exitCode = 1;
            }
            } finally {
              await page.close();
            }
          } finally {
            await browser.close();
          }
          NODE
      - name: Verify real playback of legacy Spine 3.7 binary
        if: always()
        env:
          SITE: https://spine-link.vercel.app
        run: node tests/spine37-binary-preview.e2e.mjs
      - name: Verify production rejects invalid Google credentials
        shell: bash
        env:
          SITE: https://spine-link.vercel.app
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const response = await fetch(process.env.SITE + '/api/github-upload', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({
              action: 'get-index',
              googleIdToken: 'invalid-production-browser-smoke-token',
              settings: {owner:'vladleopold',repo:'spine',branch:'main'}
            }),
            signal: AbortSignal.timeout(30000)
          });
          const payload = await response.json().catch(() => ({}));
          assert.equal(response.status, 401,
            'Production must reject an invalid Google token with 401; got ' +
            response.status + ' ' + JSON.stringify(payload).slice(0,300));
          console.log('PASS production Google auth guard rejects invalid credentials with HTTP 401');
          NODE
      - name: Upload browser screenshots for diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-browser-screenshots
          path: artifacts/*.png
          retention-days: 7
          if-no-files-found: warn

      - name: Publish independently verified production status to GitHub
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.sha }}
          VERIFY_RESULT: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ "$VERIFY_RESULT" = "success" ]; then
            result=success
            description="Production Chromium: desktop, mobile, upload routing and preview passed"
          else
            result=failure
            description="Production Chromium failed: inspect screenshots and browser logs"
          fi
          # The Playwright container does not provide gh CLI. Node's built-in
          # fetch uses the existing short-lived GITHUB_TOKEN without installing
          # another binary or leaking it to the browser under test.
          REPORT_STATE="$result" REPORT_DESCRIPTION="$description" node --input-type=module <<'REPORT'
          const { GITHUB_REPOSITORY, RELEASE_SHA, GITHUB_RUN_ID, GH_TOKEN,
                  REPORT_STATE, REPORT_DESCRIPTION } = process.env;
          const url = `https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${RELEASE_SHA}`;
          const response = await fetch(url, {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${GH_TOKEN}`,
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              state: REPORT_STATE,
              context: 'spine-link/production-chromium',
              description: REPORT_DESCRIPTION,
              target_url: `https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}`
            })
          });
          if (!response.ok) {
            const details = await response.text();
            throw Error(`GitHub commit status HTTP ${response.status}: ${details.slice(0,400)}`);
          }
          console.log('Recorded', REPORT_STATE, 'for deployment commit', RELEASE_SHA);
          REPORT
