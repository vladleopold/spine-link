name: Vercel deploy and alias

# Release major/minor-compatible Spine 4.0–4.3 player alongside the archive optimizations.
# Release source-safe skeleton selection and corrupt-atlas protection after WebP-first archive acceptance.
# Release verified in-memory archive pagination (all cards embedded, WebP-first, WebM only on viewport).
# Release source with refreshed public preview cache and CI media recovery.
# Production deployments are event-driven only. Do not spend Vercel quota on
# periodic no-op releases or on edits to this workflow itself.
on:
  workflow_dispatch:
  # Deploy only after a relevant CI workflow has completed successfully.
  workflow_run:
    workflows: ["Spine-Link Agent API CI", "Spine archive WebP-first performance regression"]
    types: [completed]
  # One controlled recovery attempt after Vercel's rolling daily quota resets.
  schedule:
    - cron: '15 16 * * *'

# Queue releases rather than cancelling an in-flight validated deploy when
# another workflow_run event arrives. The source-SHA guard rejects stale queued
# releases, and the last-success check deduplicates multiple events for one SHA.
permissions:
  contents: read
  actions: read

concurrency:
  group: spine-link-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    steps:
      - name: Skip scheduled or CI-gated release when commit is already deployed
        id: quota_recovery
        if: github.event_name == 'schedule' || github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # After a failed automatic deployment, do not hammer Vercel while its
          # rolling 24-hour deployment quota is still exhausted. Manual dispatch
          # intentionally bypasses this cooldown.
          latest=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/vercel-deploy-and-alias.yml/runs?status=completed&per_page=1")
          latest_conclusion=$(printf '%s' "$latest" | jq -r '.workflow_runs[0].conclusion // ""')
          latest_updated=$(printf '%s' "$latest" | jq -r '.workflow_runs[0].updated_at // ""')
          if [ "$latest_conclusion" = "failure" ] && [ -n "$latest_updated" ]; then
            failed_at=$(date -u -d "$latest_updated" +%s)
            now=$(date -u +%s)
            age=$((now - failed_at))
            if [ "$age" -ge 0 ] && [ "$age" -lt 86400 ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "Previous automatic deployment failed less than 24h ago; waiting for quota recovery."
              exit 0
            fi
          fi
          deploy_sha="${{ github.event.workflow_run.head_sha || github.sha }}"
          last_success=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/vercel-deploy-and-alias.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].head_sha // ""' || true)
          if [ "$last_success" = "$deploy_sha" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No new commit since the previous successful deployment."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate Vercel secrets
        if: steps.quota_recovery.outputs.skip != 'true'
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Missing VERCEL_TOKEN GitHub secret."
            exit 1
          fi
          if [ -z "$VERCEL_SCOPE" ]; then
            echo "::error::Missing VERCEL_SCOPE GitHub secret."
            exit 1
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_SCOPE: ${{ secrets.VERCEL_SCOPE }}

      - name: Check out repo
        if: steps.quota_recovery.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Ensure source has not changed since the successful CI run
        if: ${{ github.event_name == 'workflow_run' && steps.quota_recovery.outputs.skip != 'true' }}
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$TESTED_SHA"
          changed="$(git diff --name-only "$TESTED_SHA" "$GITHUB_SHA")"
          unexpected=""
          if [ -n "$changed" ]; then
            unexpected="$(printf '%s\n' "$changed" | grep -Fvx ".github/workflows/vercel-deploy-and-alias.yml" || true)"
          fi
          if [ -n "$unexpected" ]; then
            echo "::error::Application or test files changed after the successful CI run for $TESTED_SHA. Refusing to deploy unverified source."
            printf '%s\n' "$unexpected"
            exit 1
          fi
          echo "Production source matches the successful CI commit; only the deploy workflow changed afterward."

      - name: Set up Node
        if: steps.quota_recovery.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test preview lookup and cache freshness
        if: steps.quota_recovery.outputs.skip != 'true'
        run: node --test tests/preview-cache.test.mjs tests/preview-metadata.test.mjs tests/archive-speed.test.mjs

      - name: Verify full API suite and website build before release
        if: steps.quota_recovery.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          node --test \
            tests/agent-animation-api.test.mjs \
            tests/spine-link-agent-sdk.test.mjs \
            tests/agent-api-pages.test.mjs \
            tests/google-auth-guard.test.mjs
          npm run build
          test -s dist/api-keys.html
          test -s dist/api-keys.js
          test -s dist/sdk/spine-link-agent.mjs
          test -s dist/agent-animation-openapi.json
          echo "Validated API security, project deletion, authentication and static dashboard before deploying."

      - name: Install Vercel CLI
        if: steps.quota_recovery.outputs.skip != 'true'
        run: npm install -g vercel@latest

      - name: Initialize missing production API signing secret
        if: steps.quota_recovery.outputs.skip != 'true'
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_SCOPE: ${{ secrets.VERCEL_SCOPE }}
        run: |
          set -euo pipefail
          # Never print, download or rotate an existing signing secret.
          # Rotating it would invalidate every user's personal key.
          vercel link --yes --project spine-link --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" >/dev/null
          configured=$(vercel env ls production --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" 2>&1)
          if printf '%s' "$configured" | grep -q 'SPINE_LINK_AGENT_API_KEY'; then
            echo "Agent API signing secret is already configured in production."
          else
            umask 077
            private_file=$(mktemp)
            trap 'rm -f "$private_file"' EXIT
            openssl rand -hex 32 > "$private_file"
            vercel env add SPINE_LINK_AGENT_API_KEY production --type secret --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" < "$private_file" >/dev/null
            echo "Created production Secret for the personal Agent API. Value is not logged."
          fi

      - name: Deploy to Vercel
        if: steps.quota_recovery.outputs.skip != 'true'
        id: deploy
        run: |
          DEPLOY_URL=$(vercel deploy --prod --yes --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE")
          echo "deploy_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_SCOPE: ${{ secrets.VERCEL_SCOPE }}

      - name: Point aliases to newest deployment
        if: steps.quota_recovery.outputs.skip != 'true'
        run: |
          vercel alias set "${{ steps.deploy.outputs.deploy_url }}" spine-link.vercel.app --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" --non-interactive
          vercel alias set "${{ steps.deploy.outputs.deploy_url }}" spinepreview-vercel.vercel.app --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" --non-interactive
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_SCOPE: ${{ secrets.VERCEL_SCOPE }}

      - name: Verify poster-first archive on production
        if: steps.quota_recovery.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 25 'https://spine-link.vercel.app/world-spine-archive' -o /tmp/spine-archive-live.html
          grep -q 'data-video-src=' /tmp/spine-archive-live.html
          grep -q 'prefetchNext()' /tmp/spine-archive-live.html
          grep -q 'id="archive-next-page"' /tmp/spine-archive-live.html
          if grep -q '<video src=' /tmp/spine-archive-live.html; then
            echo '::error::Archive is eagerly downloading WebM instead of serving WebP posters'
            exit 1
          fi
          echo 'PASS WebP-first static HTML, deferred WebM and next-page prefetch on production'
          for attempt in 1 2 3; do
            seconds=$(curl -fsS --max-time 25 -o /tmp/spine-archive-feed.json -w '%{time_total}' \
              'https://spine-link.vercel.app/api/github-archive?feed=archive&offset=12&limit=12')
            echo "ARCHIVE_FEED_HTTP_SECONDS=$seconds"
          done
          node --input-type=module -e '
            import fs from "node:fs";
            const data=JSON.parse(fs.readFileSync("/tmp/spine-archive-feed.json","utf8"));
            if(!data.ok||!Array.isArray(data.entries)||data.entries.length<1)
              throw Error("No lazy archive cards delivered");
            if(data.entries.some(e=>!e.poster&&e.video))
              console.log("Some historical entries lack posters; source generation remains independent");
            console.log("PASS archive feed pagination entries="+data.entries.length);
          '

      - name: Verify agent API route after publishing
        if: steps.quota_recovery.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS --max-time 30 -o /tmp/agent-api-health.json -w '%{http_code}' 'https://spine-link.vercel.app/api/agent-animation')
          if [ "$code" = 401 ]; then
            echo "Agent API route is live and requires authentication."
          else
            echo "::error::Agent API route returned unexpected HTTP $code"
            cat /tmp/agent-api-health.json
            exit 1
          fi
      - name: Verify personal API key dashboard is published
        if: steps.quota_recovery.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          for route in api-keys.html api-keys.js; do
            code=$(curl -fsS --max-time 30 -o "/tmp/$route" -w '%{http_code}' "https://spine-link.vercel.app/$route")
            test "$code" = 200
          done
          grep -q "My API keys" /tmp/api-keys.html
          grep -q "keys-create" /tmp/api-keys.js
          echo "Personal API key dashboard and client JavaScript are live."

      - name: Smoke test new Spine preview and assets
        if: steps.quota_recovery.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          preview_url="https://spine-link.vercel.app/p/symbols-2026-11-14T09-03-37-245Z"
          for attempt in $(seq 1 8); do
            status=$(curl -sSL --max-time 25 -o /tmp/spine-preview-smoke.html -w '%{http_code}' "$preview_url" || true)
            if [ "$status" = 200 ] && grep -q 'spine-preview-config' /tmp/spine-preview-smoke.html && grep -q 'symbols.json' /tmp/spine-preview-smoke.html && grep -q 'symbols.atlas.txt' /tmp/spine-preview-smoke.html; then
              echo "Preview page renders Spine skeleton and atlas: HTTP 200"
              exit 0
            fi
            echo "Preview smoke attempt $attempt failed (HTTP $status); retrying"
            sleep 5
          done
          echo "::error::Freshly uploaded Spine preview is missing or incomplete"
          sed -n '1,8p' /tmp/spine-preview-smoke.html || true
          exit 1
