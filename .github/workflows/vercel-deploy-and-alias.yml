name: Vercel deploy and alias

on:
  push:
    branches:
      - main
  workflow_dispatch:
  # One-time recovery after Vercel Hobby's 100-deployments/24h limit clears.
  schedule:
    - cron: '37 15 15 11 *'

# Many rapid commits can otherwise race to point the production alias at an
# older deployment after a newer one has completed.
permissions:
  contents: read
  actions: read

concurrency:
  group: spine-link-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: One-time quota recovery gate
        id: quota_recovery
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$(date -u +%F)" != "2026-11-15" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last_success=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/vercel-deploy-and-alias.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].head_sha' || true)
          if [ "$last_success" = "$GITHUB_SHA" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate Vercel secrets
        if: steps.quota_recovery.outputs.skip != 'true'
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Missing VERCEL_TOKEN GitHub secret."
            exit 1
          fi
          if [ -z "$VERCEL_SCOPE" ]; then
            echo "::error::Missing VERCEL_SCOPE GitHub secret."
            exit 1
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_SCOPE: ${{ secrets.VERCEL_SCOPE }}

      - name: Check out repo
        if: steps.quota_recovery.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Set up Node
        if: steps.quota_recovery.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test preview lookup and cache freshness
        if: steps.quota_recovery.outputs.skip != 'true'
        run: node --test tests/preview-cache.test.mjs tests/preview-metadata.test.mjs

      - name: Verify full API suite and website build before release
        if: steps.quota_recovery.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          node --test \
            tests/agent-animation-api.test.mjs \
            tests/spine-link-agent-sdk.test.mjs \
            tests/agent-api-pages.test.mjs \
            tests/google-auth-guard.test.mjs
          npm run build
          test -s dist/api-keys.html
          test -s dist/api-keys.js
          test -s dist/sdk/spine-link-agent.mjs
          test -s dist/agent-animation-openapi.json
          echo "Validated API security, project deletion, authentication and static dashboard before deploying."

      - name: Install Vercel CLI
        if: steps.quota_recovery.outputs.skip != 'true'
        run: npm install -g vercel@latest

      - name: Initialize missing production API signing secret
        if: steps.quota_recovery.outputs.skip != 'true'
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_SCOPE: ${{ secrets.VERCEL_SCOPE }}
        run: |
          set -euo pipefail
          # Never print, download or rotate an existing signing secret.
          # Rotating it would invalidate every user's personal key.
          vercel link --yes --project spine-link --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" >/dev/null
          configured=$(vercel env ls production --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" 2>&1)
          if printf '%s' "$configured" | grep -q 'SPINE_LINK_AGENT_API_KEY'; then
            echo "Agent API signing secret is already configured in production."
          else
            umask 077
            private_file=$(mktemp)
            trap 'rm -f "$private_file"' EXIT
            openssl rand -hex 32 > "$private_file"
            vercel env add SPINE_LINK_AGENT_API_KEY production --type secret --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" < "$private_file" >/dev/null
            echo "Created production Secret for the personal Agent API. Value is not logged."
          fi

      - name: Deploy to Vercel
        if: steps.quota_recovery.outputs.skip != 'true'
        id: deploy
        run: |
          DEPLOY_URL=$(vercel deploy --prod --yes --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE")
          echo "deploy_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_SCOPE: ${{ secrets.VERCEL_SCOPE }}

      - name: Point aliases to newest deployment
        if: steps.quota_recovery.outputs.skip != 'true'
        run: |
          vercel alias set "${{ steps.deploy.outputs.deploy_url }}" spine-link.vercel.app --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" --non-interactive
          vercel alias set "${{ steps.deploy.outputs.deploy_url }}" spinepreview-vercel.vercel.app --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" --non-interactive
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_SCOPE: ${{ secrets.VERCEL_SCOPE }}

      - name: Verify agent API route after publishing
        if: steps.quota_recovery.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS --max-time 30 -o /tmp/agent-api-health.json -w '%{http_code}' 'https://spine-link.vercel.app/api/agent-animation')
          if [ "$code" = 401 ]; then
            echo "Agent API route is live and requires authentication."
          else
            echo "::error::Agent API route returned unexpected HTTP $code"
            cat /tmp/agent-api-health.json
            exit 1
          fi
      - name: Verify personal API key dashboard is published
        if: steps.quota_recovery.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          for route in api-keys.html api-keys.js; do
            code=$(curl -fsS --max-time 30 -o "/tmp/$route" -w '%{http_code}' "https://spine-link.vercel.app/$route")
            test "$code" = 200
          done
          grep -q "My API keys" /tmp/api-keys.html
          grep -q "keys-create" /tmp/api-keys.js
          echo "Personal API key dashboard and client JavaScript are live."

      - name: Smoke test new Spine preview and assets
        if: steps.quota_recovery.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          preview_url="https://spine-link.vercel.app/p/symbols-2026-11-14T09-03-37-245Z"
          for attempt in $(seq 1 8); do
            status=$(curl -sSL --max-time 25 -o /tmp/spine-preview-smoke.html -w '%{http_code}' "$preview_url" || true)
            if [ "$status" = 200 ] && grep -q 'spine-preview-config' /tmp/spine-preview-smoke.html && grep -q 'symbols.json' /tmp/spine-preview-smoke.html && grep -q 'symbols.atlas.txt' /tmp/spine-preview-smoke.html; then
              echo "Preview page renders Spine skeleton and atlas: HTTP 200"
              exit 0
            fi
            echo "Preview smoke attempt $attempt failed (HTTP $status); retrying"
            sleep 5
          done
          echo "::error::Freshly uploaded Spine preview is missing or incomplete"
          sed -n '1,8p' /tmp/spine-preview-smoke.html || true
          exit 1
