name: Spine Export WebM

on:
  repository_dispatch:
    types: [spine-export-webm]
  workflow_dispatch:
    inputs:
      upload_id:
        description: Existing library upload ID
        required: true
        type: string
      animation:
        description: Exact animation name in the selected Spine skeleton
        required: true
        type: string

jobs:
  export:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    # Every commit job writes library_NN/index.json in the same branch, so they
    # must take turns: a concurrent push is rejected by the branch lock and the
    # loser rebuilds on a HEAD the winner has already moved.
    concurrency:
      group: spine-library-commit
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate upload and animation before starting export
        id: validate
        env:
          UPLOAD_ID: ${{ github.event.client_payload.uploadId || inputs.upload_id || '' }}
          ANIMATION: ${{ github.event.client_payload.animation || inputs.animation || '' }}
        run: node scripts/validate-webm-dispatch.mjs

      - name: Setup Python
        if: steps.validate.outputs.found == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install 2Spine skel2json converter
        if: steps.validate.outputs.found == 'true'
        run: |
          echo "=== INSTALLING 2SPINE TOOLS ==="
          pip install msgpack
          echo "=== 2SPINE TOOLS INSTALLED ==="

      - name: Install Playwright with Chromium
        if: steps.validate.outputs.found == 'true'
        run: |
          echo "=== INSTALLING PLAYWRIGHT ==="
          npm init -y
          npm install playwright@latest
          npx playwright install chromium --with-deps
          echo "=== PLAYWRIGHT INSTALLED ==="

      - name: Install system dependencies
        if: steps.validate.outputs.found == 'true'
        run: |
          echo "=== INSTALLING SYSTEM DEPS ==="
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libdrm2 libdbus-1-3 libxkbcommon0 \
            libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libpango-1.0-0 libcairo2 libasound2t64 \
            libatspi2.0-0 libwayland-client0 libwayland-cursor0 \
            libwayland-egl1 ffmpeg webp
          echo "=== SYSTEM DEPS INSTALLED ==="

      - name: Resolve library collection folder
        if: steps.validate.outputs.found == 'true'
        id: basepath
        env:
          BASE_PATH: ${{ steps.validate.outputs.basePath }}
        run: echo "basePath=$BASE_PATH" >> "$GITHUB_OUTPUT"

      - name: Compute animation duration from skeleton JSON
        if: steps.validate.outputs.found == 'true'
        id: duration
        env:
          UPLOAD_ID: ${{ github.event.client_payload.uploadId || inputs.upload_id || '' }}
          ANIMATION: ${{ github.event.client_payload.animation || inputs.animation || '' }}
          BASE_PATH: ${{ steps.basepath.outputs.basePath }}
        run: |
          set -euo pipefail
          echo "=== COMPUTING ANIMATION DURATION ==="
          uploadId="$UPLOAD_ID"
          animation="$ANIMATION"
          basePath="$BASE_PATH"
          uploadPath="${basePath}/${uploadId}"
          # Find the first directory inside uploadPath
          setName=$(find "$uploadPath" -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | head -1)
          skeletonPath=""
          if [ -n "$setName" ]; then
            for f in "${uploadPath}/${setName}"/*.json; do
              if [ -f "$f" ]; then
                skeletonPath="$f"
                break
              fi
            done
          fi
          echo "Skeleton path: $skeletonPath"
          echo "Animation: $animation"

          if [ -z "$skeletonPath" ] || [ ! -f "$skeletonPath" ]; then
            echo "Skeleton JSON not found, using fallback duration 0 to let browser calculate"
            echo "anim_duration=0" >> $GITHUB_OUTPUT
          else
            duration=$(node -e "
              const fs = require('fs');
              const animName = process.argv[1];
              const data = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
              const anim = data.animations && data.animations[animName];
              if (!anim) { console.log(0); process.exit(0); }
              let max = 0;
              const traverse = (obj) => {
                if (Array.isArray(obj)) {
                  obj.forEach(item => { if (item && typeof item.time === 'number' && item.time > max) max = item.time; });
                } else if (obj && typeof obj === 'object') {
                  Object.values(obj).forEach(traverse);
                }
              };
              traverse(anim);
              console.log(max > 0 ? max.toFixed(4) : 0);
            " "$animation" "$skeletonPath" 2>/dev/null || echo "0")
            echo "Computed duration: ${duration}s"
            echo "anim_duration=${duration}" >> $GITHUB_OUTPUT
          fi

      - name: Reconstruct atlas for JSON+PNG uploads
        if: steps.validate.outputs.found == 'true'
        env:
          UPLOAD_ID: ${{ github.event.client_payload.uploadId || inputs.upload_id || '' }}
        run: node scripts/reconstruct-missing-atlas-for-export.mjs --upload-id="$UPLOAD_ID"

      - name: Export WebM preview
        if: steps.validate.outputs.found == 'true'
        id: export
        env:
          UPLOAD_ID: ${{ github.event.client_payload.uploadId || inputs.upload_id || '' }}
          ANIMATION: ${{ github.event.client_payload.animation || inputs.animation || '' }}
          ORIGIN: ${{ github.event.client_payload.origin || inputs.origin || 'https://spine-link.vercel.app' }}
          OWNER: ${{ github.event.client_payload.owner || inputs.owner || 'vladleopold' }}
          REPO: ${{ github.event.client_payload.repo || inputs.repo || 'spine' }}
          BRANCH: ${{ github.event.client_payload.branch || inputs.branch || 'main' }}
          ANIM_DURATION: ${{ steps.duration.outputs.anim_duration }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "=== STARTING EXPORT ==="
          echo "Upload ID: $UPLOAD_ID"
          echo "Animation: $ANIMATION"
          echo "Animation duration: ${ANIM_DURATION}s"
          node scripts/spine-export-webm.mjs \
            --upload-id="$UPLOAD_ID" \
            --animation="$ANIMATION" \
            --origin="$ORIGIN" \
            --owner="$OWNER" \
            --repo="$REPO" \
            --branch="$BRANCH" \
            --repo-path="$GITHUB_WORKSPACE" \
            --anim-duration="$ANIM_DURATION" \
            --output="$GITHUB_WORKSPACE/$UPLOAD_ID-preview.webm"
          echo "=== EXPORT COMPLETED ==="

      - name: Commit and Push Atomically
        if: steps.validate.outputs.found == 'true'
        id: commit
        env:
          UPLOAD_ID: ${{ github.event.client_payload.uploadId || inputs.upload_id || '' }}
          ORIGIN: ${{ github.event.client_payload.origin || inputs.origin || 'https://spine-link.vercel.app' }}
          BASE_PATH: ${{ steps.basepath.outputs.basePath }}
        run: |
          set -euo pipefail
          uploadId="$UPLOAD_ID"
          origin="$ORIGIN"
          basePath="$BASE_PATH"
          indexPath="${basePath}/index.json"
          metaPath="${{ github.workspace }}/${uploadId}-preview.webm.json"
          atlasBackupDir="${RUNNER_TEMP}/spine-inferred-atlas-${uploadId}"
          export INDEX_PATH="$indexPath"
          export META_PATH="$metaPath"
          if ! node -e "const fs=require('fs'); const rows=JSON.parse(fs.readFileSync(process.argv[1],'utf8')); process.exit(rows.some(e=>e && e.id===process.argv[2])?0:1);" "$indexPath" "$uploadId"; then
            echo '::notice::Upload was deleted before publication; skipping preview commit.'
            echo 'published=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Keep newly inferred atlas files outside the checkout before each clean reset.
          node scripts/preserve-inferred-atlas.mjs --upload-id="$uploadId" --mode=backup --backup-dir="$atlasBackupDir"

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          MAX_RETRIES=20
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i/$MAX_RETRIES..."
            
            # 1. Always fetch fresh state first — no rebase conflicts possible
            # Shallow checkouts do not refresh origin/main on a plain fetch, so
            # the remote ref is fetched explicitly; otherwise every retry rebuilt
            # on the stale HEAD and the push was rejected all the same.
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
            git reset --hard refs/remotes/origin/main

            if ! node -e "const fs=require('fs'); const rows=JSON.parse(fs.readFileSync(process.argv[1],'utf8')); process.exit(rows.some(e=>e && e.id===process.argv[2])?0:1);" "$indexPath" "$uploadId"; then
              echo '::notice::Upload was deleted during export; skipping preview publication.'
              echo 'published=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # Re-apply inferred atlases after refreshing main; stage them with the preview output.
            node scripts/preserve-inferred-atlas.mjs --upload-id="$uploadId" --mode=restore --backup-dir="$atlasBackupDir"

          # 2. Copy media files on top of fresh state
          mkdir -p "${basePath}/${uploadId}"
          for ext in "webm" "webp"; do
            for suffix in "" "-medium" "-low"; do
              # Script outputs: {uploadId}-preview{suffix}.webm
              f="${uploadId}-preview${suffix}.${ext}"
              if [ -f "$f" ]; then
                # Rename to: preview{suffix}.webm (inside uploadId dir)
                cp "$f" "${basePath}/${uploadId}/preview${suffix}.${ext}"
                echo "Copied: $f -> ${basePath}/${uploadId}/preview${suffix}.${ext}"
              fi
            done
          done
            
            # 3. Update index.json on top of fresh state
            node -e "
              const fs = require('fs');
              const uploadId = process.env.UPLOAD_ID;
              const origin = process.env.ORIGIN;
              const basePath = process.env.BASE_PATH;
              const indexPath = process.env.INDEX_PATH;
              const metaPath = process.env.META_PATH;
              
              const indexData = JSON.parse(fs.readFileSync(indexPath, 'utf8'));
              let videoMeta = {};
              let isError = false;
              if (fs.existsSync(metaPath)) {
                try { videoMeta = JSON.parse(fs.readFileSync(metaPath, 'utf8')); if (videoMeta.error) isError = true; } catch(e) {}
              }
              
              const uploadedUrls = {};
              const targetDir = basePath + '/' + uploadId;
              
              ['', '-medium', '-low'].forEach(suffix => {
                const webmF = 'preview' + suffix + '.webm';
                const webpF = 'preview' + suffix + '.webp';
                if (fs.existsSync(targetDir + '/' + webmF)) {
                  let k = 'webmPreview'; if (suffix === '-medium') k = 'webmPreviewMedium'; if (suffix === '-low') k = 'webmPreviewLow';
                  uploadedUrls[k] = origin + '/assets/' + basePath + '/' + uploadId + '/' + webmF;
                }
                if (fs.existsSync(targetDir + '/' + webpF)) {
                  let k = 'webpPoster'; if (suffix === '-medium') k = 'webpPosterMedium'; if (suffix === '-low') k = 'webpPosterLow';
                  uploadedUrls[k] = origin + '/assets/' + basePath + '/' + uploadId + '/' + webpF;
                }
              });
              
              const entryIndex = indexData.findIndex(e => e.id === uploadId);
              if (entryIndex !== -1) {
                delete indexData[entryIndex].webmChunksJson;
                delete indexData[entryIndex].webmChunks;
                delete indexData[entryIndex].webmChunkCount;
                delete indexData[entryIndex].webmIsChunked;
                
                indexData[entryIndex] = {
                  ...indexData[entryIndex],
                  ...uploadedUrls,
                  webmPreviewPath: isError ? undefined : \`\${basePath}/\${uploadId}/preview.webm\`,
                  webmStatus: isError ? 'error' : 'ready',
                  webmError: isError ? videoMeta.error : undefined,
                  webmGeneratedAt: new Date().toISOString(),
                  ...(typeof videoMeta.animation === 'string' && videoMeta.animation
                    ? { previewAnimation: videoMeta.animation, previewStatus: 'ready' }
                    : {}),
                  ...(videoMeta.width > 0 ? { previewWidth: videoMeta.width } : {}),
                  ...(videoMeta.height > 0 ? { previewHeight: videoMeta.height } : {}),
                  ...(videoMeta.animationDuration > 0 ? { previewDuration: videoMeta.animationDuration } : {}),
                  ...(videoMeta.skeletonWidth > 0 ? { skeletonWidth: videoMeta.skeletonWidth } : {}),
                  ...(videoMeta.skeletonHeight > 0 ? { skeletonHeight: videoMeta.skeletonHeight } : {}),
                };
              }
              fs.writeFileSync(indexPath, JSON.stringify(indexData, null, 2));
            "
            
            # 4. Stage and commit
            git add "$basePath"
            if git diff-index --quiet HEAD --; then
              echo "No changes to commit (perhaps already processed?)"
              echo 'published=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            
            git commit -m "Auto-export media for ${uploadId}"
            
            # 5. Push — if rejected, loop back with fresh HEAD
            if git push origin HEAD:main; then
              echo "Successfully committed and pushed on attempt $i!"
              echo 'published=true' >> "$GITHUB_OUTPUT"
              exit 0
            else
              echo "Push rejected. Retrying with fresh HEAD..."
              sleep $((RANDOM % 5 + 2))
            fi
          done
          
          echo "Failed to push after $MAX_RETRIES attempts."
          exit 1

      - name: Trigger full animation export (background)
        if: steps.validate.outputs.found == 'true' && steps.commit.outputs.published == 'true'
        env:
          UPLOAD_ID: ${{ github.event.client_payload.uploadId || inputs.upload_id || '' }}
          ORIGIN: ${{ github.event.client_payload.origin || inputs.origin || 'https://spine-link.vercel.app' }}
          OWNER: ${{ github.event.client_payload.owner || inputs.owner || 'vladleopold' }}
          REPO: ${{ github.event.client_payload.repo || inputs.repo || 'spine' }}
          BRANCH: ${{ github.event.client_payload.branch || inputs.branch || 'main' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload=$(jq -n --arg uploadId "$UPLOAD_ID" --arg origin "$ORIGIN" --arg owner "$OWNER" --arg repo "$REPO" --arg branch "$BRANCH" \
            '{event_type:"spine-export-full",client_payload:{uploadId:$uploadId,origin:$origin,owner:$owner,repo:$repo,branch:$branch}}')
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/dispatches" \
            -d "$payload"
          echo "Dispatched spine-export-full for $UPLOAD_ID"
