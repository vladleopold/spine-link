name: Spine Export WebM

on:
  repository_dispatch:
    types: [spine-export-webm]

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Debug - Check files exist before processing
        id: debug-check
        run: |
          echo "=== DEBUG: CHECKING FILES ==="
          uploadId="${{ github.event.client_payload.uploadId }}"
          animation="${{ github.event.client_payload.animation }}"
          uploadPath="library/${uploadId}"
          setName="$(ls -1 ${uploadPath} 2>/dev/null | head -1 || echo 'NO_SETS')"
          echo "Upload ID: $uploadId"
          echo "Animation: $animation"
          echo "Upload Path: $uploadPath"
          echo "Set Name: $setName"
          echo "Library directory exists: $(test -d library && echo 'YES' || echo 'NO')"
          echo "Upload directory exists: $(test -d $uploadPath && echo 'YES' || echo 'NO')"
          echo "=== LIBRARY CONTENTS ==="
          ls -la library/ 2>/dev/null || echo "Failed to list library/"
          echo "=== UPLOAD PATH CONTENTS ==="
          ls -la $uploadPath/ 2>/dev/null || echo "Failed to list upload path"
          echo "=== INDEX.JSON ==="
          if [ -f "library/index.json" ]; then
            echo "index.json exists"
            echo "Size: $(stat -f%z library/index.json) bytes"
            echo "First 500 chars: $(head -c 500 library/index.json)"
          else
            echo "ERROR: index.json not found"
          fi
          echo "=== DEBUG CHECK COMPLETE ==="

      - name: Install Playwright with Chromium
        run: |
          echo "=== DEBUG: INSTALLING PLAYWRIGHT ==="
          npm init -y
          echo "Created package.json with: $(cat package.json)"
          npm install playwright@1.59.1
          echo "Playwright installed"
          npx playwright install chromium
          echo "=== DEBUG: PLAYWRIGHT INSTALLED ==="
          echo "=== DEBUG: END OF PLAYWRIGHT INSTALLATION ==="
          echo "=== DEBUG: PLAYWRIGHT VERSION ==="
          npx playwright --version

      - name: Install system dependencies
        run: |
          echo "=== DEBUG: INSTALLING SYSTEM DEPENDENCIES ==="
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          for attempt in 1 2 3; do
            if sudo apt-get update; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 5
          done
          echo "=== DEBUG: APT UPDATE COMPLETE ==="
          sudo apt-get install -y ffmpeg \
            libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libdrm2 libdbus-1-3 libxkbcommon0 \
            libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libpango-1.0-0 libcairo2 libasound2t64 \
            libatspi2.0-0 libwayland-client0 libwayland-cursor0 \
            libwayland-egl1 \
            libwebp-tools imagemagick
          echo "=== DEBUG: SYSTEM DEPENDENCIES INSTALLED ==="

      - name: Export WebM preview
        id: export
        run: |
          echo "=== DEBUG: STARTING EXPORT ==="
          uploadId="${{ github.event.client_payload.uploadId }}"
          animation="${{ github.event.client_payload.animation }}"
          origin="${{ github.event.client_payload.origin }}"
          owner="${{ github.event.client_payload.owner }}"
          repo="${{ github.event.client_payload.repo }}"
          branch="${{ github.event.client_payload.branch }}"
          
          echo "Upload ID: $uploadId"
          echo "Animation: $animation"
          echo "Origin: $origin"
          echo "Owner: $owner"
          echo "Repo: $repo"
          
          node scripts/spine-export-webm.mjs \
            --upload-id="${{ github.event.client_payload.uploadId }}" \
            --animation="${{ github.event.client_payload.animation }}" \
            --origin="${{ github.event.client_payload.origin }}" \
            --owner="${{ github.event.client_payload.owner }}" \
            --repo="${{ github.event.client_payload.repo }}" \
            --branch="${{ github.event.client_payload.branch }}" \
            --repo-path="${{ github.workspace }}" \
            --output="${{ github.workspace }}/${{ github.event.client_payload.uploadId }}-preview.webm"
          echo "=== EXPORT COMPLETED ==="
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Debug - Check output file
        if: always()
        run: |
          echo "=== DEBUG: CHECKING OUTPUT ==="
          uploadId="${{ github.event.client_payload.uploadId }}"
          if [ -f "${{ github.workspace }}/${{ github.event.client_payload.uploadId }}-preview.webm" ]; then
            echo "WebM file exists"
            ls -lh "${{ github.workspace }}/${{ github.event.client_payload.uploadId }}-preview.webm"
          else
            echo "ERROR: WebM file not found"
            ls -la "${{ github.workspace }}/"
          fi

      - name: Upload webm to GitHub
        id: upload
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const uploadId = '${{ github.event.client_payload.uploadId }}';
            const basePath = 'library';
            const previewPath = `${basePath}/${uploadId}/preview.webm`;
            const webmPath = `${{ github.workspace }}/${uploadId}-preview.webm`;
            
            console.log("=== DEBUG: UPLOADING FILE ===");
            console.log("WebM path:", webmPath);
            console.log("File exists:", fs.existsSync(webmPath));
            
            if (!fs.existsSync(webmPath)) {
              core.setFailed(`File not found: ${webmPath}`);
              return;
            }
            
            const content = fs.readFileSync(webmPath, 'base64');
            const stats = fs.statSync(webmPath);
            console.log("File size:", stats.size, "bytes");

            const branch = '${{ github.event.client_payload.branch }}' || 'main';

            async function getSha(path) {
              try {
                const { data } = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path,
                  ref: branch,
                });
                return data.sha;
              } catch {
                return null;
              }
            }

            const existingSha = await getSha(previewPath);
            console.log("Existing SHA:", existingSha);

            const result = await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: previewPath,
              message: `Add WebM preview for ${uploadId}`,
              content,
              branch,
              ...(existingSha ? { sha: existingSha } : {}),
            });

            const webmUrl = `${{ github.event.client_payload.origin }}/assets/${previewPath}`;
            console.log("=== DEBUG: FILE UPLOADED ===");
            console.log("Uploaded:", webmUrl);
            console.log("Result:", JSON.stringify(result, null, 2));
            
            // Verify file availability
            console.log("=== DEBUG: VERIFYING FILE AVAILABILITY ===");
            try {
              const verify = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: previewPath,
                ref: branch,
              });
              console.log("File verification successful:", !!verify.data?.download_url);
              console.log("Download URL:", verify.data?.download_url);
            } catch (err) {
              console.log("File verification failed:", err.message);
            }
            
            core.setOutput('webm_url', webmUrl);

      - name: Upload webp posters and update index
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const uploadId = '${{ github.event.client_payload.uploadId }}';
            const basePath = 'library';
            const origin = '${{ github.event.client_payload.origin }}';
            const branch = '${{ github.event.client_payload.branch }}' || 'main';
            const workspace = '${{ github.workspace }}';

            const webpFiles = [
              { local: `${workspace}/${uploadId}-preview.webp`, repoPath: `${basePath}/${uploadId}/preview.webp`, key: 'webpPoster' },
              { local: `${workspace}/${uploadId}-preview-medium.webp`, repoPath: `${basePath}/${uploadId}/preview-medium.webp`, key: 'webpPosterMedium' },
              { local: `${workspace}/${uploadId}-preview-low.webp`, repoPath: `${basePath}/${uploadId}/preview-low.webp`, key: 'webpPosterLow' },
            ];

            const webpResults = {};

            for (const f of webpFiles) {
              if (!fs.existsSync(f.local)) {
                console.log(`WebP not found: ${f.local}, skipping`);
                continue;
              }
              const content = fs.readFileSync(f.local, 'base64');
              const stats = fs.statSync(f.local);
              console.log(`Uploading WebP: ${f.local} (${stats.size} bytes)`);

              let existingSha = null;
              try {
                const existing = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: f.repoPath,
                  ref: branch,
                });
                existingSha = existing.data.sha;
              } catch {}

              const result = await github.rest.repos.createOrUpdateFileContents({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: f.repoPath,
                message: `Add WebP poster for ${uploadId}`,
                content,
                branch,
                ...(existingSha ? { sha: existingSha } : {}),
              });

              const url = `${origin}/assets/${f.repoPath}`;
              webpResults[f.key] = url;
              console.log(`Uploaded WebP: ${url}`);
            }

            // Update index entry with webp poster URLs
            const indexPath = `${basePath}/index.json`;
            const { data: indexData } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: indexPath,
              ref: branch,
            });

            const content = Buffer.from(indexData.content, 'base64').toString('utf8');
            const entries = JSON.parse(content);
            const entryIndex = entries.findIndex(e => e.id === uploadId);

            if (entryIndex !== -1) {
              entries[entryIndex] = {
                ...entries[entryIndex],
                ...webpResults,
                posterGeneratedAt: new Date().toISOString(),
              };

              const newContent = Buffer.from(JSON.stringify(entries, null, 2)).toString('base64');
              await github.rest.repos.createOrUpdateFileContents({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: indexPath,
                message: `Update WebP posters for ${uploadId}`,
                content: newContent,
                sha: indexData.sha,
                branch,
              });
              console.log(`Updated index with WebP posters for ${uploadId}`);
            }

            core.setOutput('webp_urls', JSON.stringify(webpResults));

      - name: Update index entry with webmPreview
        uses: actions/github-script@v7
        with:
          script: |
            const uploadId = '${{ github.event.client_payload.uploadId }}';
            const webmUrl = '${{ steps.upload.outputs.webm_url }}';
            const basePath = 'library';
            const indexPath = `${basePath}/index.json`;

            console.log("=== DEBUG: UPDATING INDEX ===");
            console.log("Upload ID:", uploadId);
            console.log("WebM URL:", webmUrl);
            console.log("Index path:", indexPath);

            const branch = '${{ github.event.client_payload.branch }}' || 'main';

            const { data: indexData } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: indexPath,
              ref: branch,
            });

            console.log("Index fetched, SHA:", indexData.sha);

            const content = Buffer.from(indexData.content, 'base64').toString('utf8');
            const entries = JSON.parse(content);
            console.log("Total entries:", entries.length);
            
            const entryIndex = entries.findIndex(e => e.id === uploadId);
            const webmExists = fs.existsSync(webmPath);
            console.log("Entry index:", entryIndex);

            if (entryIndex === -1) {
              console.log(`Entry ${uploadId} not found in index, skipping update`);
              return;
            }

            entries[entryIndex] = {
              ...entries[entryIndex],
              webmPreview: webmExists ? webmUrl : undefined,
              webmPreviewPath: webmExists ? `${basePath}/${uploadId}/preview.webm` : undefined,
              webmStatus: webmExists ? 'ready' : 'error',
              webmGeneratedAt: new Date().toISOString(),
            };

            const newContent = Buffer.from(JSON.stringify(entries, null, 2)).toString('base64');
            console.log("New content size:", Buffer.byteLength(newContent), "bytes");

            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: indexPath,
              message: `Update WebM preview for ${uploadId}`,
              content: newContent,
              sha: indexData.sha,
              branch,
            });

            console.log("=== DEBUG: INDEX UPDATED ===");
            
            // Verify index update
            const verifyIndex = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: indexPath,
              ref: branch,
            });
            
            const verifyContent = Buffer.from(verifyIndex.data.content, 'base64').toString('utf8');
            const verifyEntries = JSON.parse(verifyContent);
            const verifyEntry = verifyEntries.find(e => e.id === uploadId);
            
            console.log("=== DEBUG: VERIFYING INDEX UPDATE ===");
            console.log("Entry webmStatus:", verifyEntry?.webmStatus);
            console.log("Entry webmPreview:", verifyEntry?.webmPreview);
            
            console.log(`Updated index entry ${uploadId} with webmPreview`);