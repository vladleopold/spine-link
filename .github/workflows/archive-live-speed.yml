# Live benchmark after deploying all-page embedded archive metadata.
name: Spine archive live one-second lazy-card browser proof
on:
  workflow_run:
    workflows: ["Vercel deploy and alias"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  release_gate:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    outputs:
      deployed: ${{ steps.inspect.outputs.deployed }}
    steps:
      - name: Confirm upstream run performed a real production deployment
        id: inspect
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/jobs?per_page=100")"
          deployed="$(printf '%s' "$jobs" | jq -r '[.jobs[].steps[]? | select(.name == "Deploy to Vercel" and .conclusion == "success")] | length > 0')"
          echo "deployed=$deployed" >> "$GITHUB_OUTPUT"
          echo "REAL_PRODUCTION_DEPLOY=$deployed"
  chromium:
    needs: release_gate
    if: ${{ always() && (github.event_name != 'workflow_run' || needs.release_gate.outputs.deployed == 'true') }}
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify poster-first lazy pagination for desktop and mobile
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          try {
            for(const viewport of [{width:1280,height:800},{width:390,height:844}]){
              const page=await browser.newPage({viewport,reducedMotion:'no-preference'});
              const pageErrors=[],mediaRequests=[];
              let blockedApiRequests=0;
              // Prove the first lazy page is supplied in HTML, without
              // relying on a warm GitHub feed endpoint at all.
              const blockArchiveFeed = url => url.pathname==='/api/github-archive' &&
                url.searchParams.get('feed')==='archive';
              await page.route(blockArchiveFeed,route=>{
                blockedApiRequests++;
                return route.abort();
              });
              page.on('pageerror',e=>pageErrors.push(String(e)));
              page.on('request',r=>{
                if(/\.(?:webm|webp)(?:\?|$)/.test(r.url()))mediaRequests.push({
                  url:r.url(),type:/\.webm(?:\?|$)/.test(r.url())?'webm':'webp',at:Date.now()
                });
              });
              try {
                const started=Date.now();
                const response=await page.goto('https://spine-link.vercel.app/world-spine-archive',{
                  waitUntil:'domcontentloaded',timeout:45000,
                });
                assert.equal(response?.status(),200);
                const firstHtml=await page.content();
                assert.match(firstHtml,/data-video-src=/,'No deferred video data on gallery cards');
                assert.ok(!firstHtml.includes('<video src="'),'Initial cards must never eagerly load WebM');
                await page.waitForFunction(()=>{
                  const img=document.querySelector('.feed-card img');
                  return img&&img.complete&&img.naturalWidth>0;
                },{timeout:20000});
                await page.locator('.feed-card img').first().evaluate(img=>img.decode());
                const initialPosterMs=Date.now()-started;
                const initialTiming=await page.evaluate(()=>{
                  const nav=performance.getEntriesByType('navigation')[0];
                  const img=document.querySelector('.feed-card img');
                  const resource=img?performance.getEntriesByName(img.currentSrc||img.src).filter(x=>x.entryType==='resource').at(-1):null;
                  return {
                    responseStartMs:Math.round(nav?.responseStart||0),
                    domContentLoadedMs:Math.round(nav?.domContentLoadedEventEnd||0),
                    posterStartMs:Math.round(resource?.startTime||0),
                    posterEndMs:Math.round(resource?.responseEnd||0),
                    posterTransferBytes:Math.round(resource?.transferSize||0),
                  };
                });
                console.log('ARCHIVE_INITIAL_POSTER_EVIDENCE '+JSON.stringify({
                  viewport:viewport.width,initialMs:initialPosterMs,...initialTiming
                }));
                assert.ok(initialPosterMs<=1000,
                  'First archive card WebP did not decode within one second: '+initialPosterMs+'ms');
                // Capture initial visibility BEFORE the deliberate 1.9s warm-up.
                // The old initialMs included this sleep and misreported page latency.
                const firstWebp=mediaRequests.find(r=>r.type==='webp');
                const firstWebm=mediaRequests.find(r=>r.type==='webm');
                if(firstWebm&&firstWebp)assert.ok(firstWebm.at>=firstWebp.at,
                  'WebM requested before WebP');
                // Normal users spend time looking at the first cards, which is
                // when the one-page-ahead JSON and six WebP posters are warmed.
                await page.waitForTimeout(1900);
                const before=await page.locator('.feed-card').count();
              const scrollStart=Date.now();
              await page.locator('#sentinel').scrollIntoViewIfNeeded();
              await page.waitForFunction(n=>document.querySelectorAll('.feed-card').length>n,
                before,{timeout:9500});
              const latency=Date.now()-scrollStart;
              await page.waitForFunction(n=>{
                const newCards=Array.from(document.querySelectorAll('.feed-card')).slice(n,n+6);
                return newCards.filter(card=>{
                  const image=card.querySelector('img');
                  return image && image.complete && image.naturalWidth>0;
                }).length>=3;
              },before,{timeout:9000});
              const posterMs=Date.now()-scrollStart;
              const after=await page.locator('.feed-card').count();
              assert.ok(after>before);
              assert.deepEqual(pageErrors,[],'Production gallery JavaScript errors');
              // Continue through the live archive until the first 40 newest
              // public animation cards are present in the DOM.
              while(await page.locator('.feed-card').count()<40){
                const previous=await page.locator('.feed-card').count();
                await page.locator('#sentinel').scrollIntoViewIfNeeded();
                await page.waitForFunction(n=>document.querySelectorAll('.feed-card').length>n,
                  previous,{timeout:12000});
              }
              const first40=await page.locator('.feed-card').evaluateAll(cards=>cards.slice(0,40).map(card=>{
                const image=card.querySelector('.feed-media img');
                const video=card.dataset.videoSrc||'';
                const poster=image?.getAttribute('src')||'';
                return {
                  id:card.dataset.entryId||'',
                  status:card.dataset.previewStatus||'',
                  sourceWebmStatus:card.dataset.sourceWebmStatus||'',
                  sourcePreviewStatus:card.dataset.sourcePreviewStatus||'',
                  video,poster,
                  imageCount:card.querySelectorAll('.feed-media img').length,
                  fallback:!!card.querySelector('[data-fallback-src],[data-video-fallback],.feed-placeholder,.media-fallback'),
                  mediaText:(card.querySelector('.feed-media')?.textContent||'').trim(),
                };
              }));
              assert.equal(first40.length,40,'Archive did not expose 40 newest cards');
              const paired=first40.filter(item=>item.video&&item.poster);
              const badPairs=first40.filter(item=>{
                if(!item.video&&!item.poster)return false;
                if(!item.video||!item.poster||item.imageCount!==1)return true;
                try{
                  const video=new URL(item.video),poster=new URL(item.poster);
                  const videoName=video.pathname.split('/').pop().toLowerCase();
                  const posterName=poster.pathname.split('/').pop().toLowerCase();
                  return !['preview-medium.webm','preview-low.webm'].includes(videoName)||
                    posterName!==videoName.replace(/\.webm$/,'.webp')||
                    video.pathname.slice(0,video.pathname.lastIndexOf('/')+1)!==
                      poster.pathname.slice(0,poster.pathname.lastIndexOf('/')+1);
                }catch{return true;}
              });
              const fallbacks=first40.filter(item=>item.fallback||item.mediaText);
              const newest20=first40.slice(0,20);
              const newest20Missing=newest20.filter(item=>!item.video||!item.poster);
              const newest20Blocked=newest20.filter(item=>
                item.sourceWebmStatus.startsWith('blocked-')&&
                item.sourcePreviewStatus==='blocked'&&!item.video&&!item.poster);
              const newest20UnexpectedMissing=newest20Missing.filter(item=>!newest20Blocked.includes(item));
              const newest20InvalidBlocked=newest20.filter(item=>
                item.sourceWebmStatus.startsWith('blocked-')&&
                item.sourcePreviewStatus==='blocked'&&(item.video||item.poster));
              const older20Missing=first40.slice(20,40).filter(item=>!item.video||!item.poster);
              // Every eligible newest card must have its own WebM/WebP pair.
              // Explicitly blocked source records remain blank; never guess an
              // animation or substitute an unrelated texture as a fake preview.
              assert.deepEqual(badPairs,[],'Mismatched video/poster quality or work path in first 40 cards');
              assert.deepEqual(fallbacks,[],'Archive card contains a forbidden image/text fallback');
              const checks=await Promise.all(paired.map(async item=>{
                const [posterResponse,videoResponse]=await Promise.all([
                  page.request.get(item.poster,{headers:{Range:'bytes=0-63'},timeout:20000}),
                  page.request.get(item.video,{headers:{Range:'bytes=0-63'},timeout:20000}),
                ]);
                const [posterBytes,videoBytes]=await Promise.all([posterResponse.body(),videoResponse.body()]);
                return {
                  posterStatus:posterResponse.status(),
                  videoStatus:videoResponse.status(),
                  webp:posterBytes.length>=12&&posterBytes.subarray(0,4).toString('ascii')==='RIFF'&&
                    posterBytes.subarray(8,12).toString('ascii')==='WEBP',
                  webm:videoBytes.length>=4&&videoBytes.subarray(0,4).equals(Buffer.from([0x1a,0x45,0xdf,0xa3])),
                };
              }));
              const broken=checks.filter(x=>![200,206].includes(x.posterStatus)||
                ![200,206].includes(x.videoStatus)||!x.webp||!x.webm);
              console.log('ARCHIVE_FIRST40_EVIDENCE '+JSON.stringify({
                viewport:viewport.width,initialMs:initialPosterMs,initialTiming,appendMs:latency,posterMs,
                before,after,checked:checks.length,newest20Ready:20-newest20Blocked.length,newest20Blocked:newest20Blocked.length,
                older20Ready:20-older20Missing.length,older20Missing:older20Missing.length,
                blockedApiRequests,webpRequests:mediaRequests.filter(x=>x.type==='webp').length,
                webmRequests:mediaRequests.filter(x=>x.type==='webm').length,
                brokenAssets:broken,
              }));
              assert.deepEqual(newest20UnexpectedMissing,[],
                'An eligible newest-20 card is missing its original WebM/WebP pair');
              assert.deepEqual(newest20InvalidBlocked,[],
                'A blocked card must not expose partial or fabricated preview media');
              assert.equal(newest20Missing.length,newest20Blocked.length,
                'Every newest-20 missing preview must have an explicit blocked status');
              assert.deepEqual(broken,[],'One of the first 40 cards has a missing/non-WebP/non-WebM asset');
              assert.ok(latency<=1000,'Next card batch took more than 1 second to appear: '+latency+'ms');
              assert.ok(posterMs<=1000,'Three new WebP posters took over one second: '+posterMs+'ms');
              // The first 40 cards are embedded in HTML. Remove the initial
              // API block only after proving that first page; then walk every
              // remaining page until the archive's explicit end sentinel.
              const expectedTotal = await page.evaluate(() => {
                const text = document.querySelector('.legend')?.textContent || '';
                const match = text.match(/([\d,]+)\s+works/i);
                return match ? Number(match[1].replace(/,/g,'')) : 0;
              });
              assert.ok(expectedTotal >= 40,'Archive total must include the embedded 40-card sample');
              await page.unroute(blockArchiveFeed);
              async function decodeCardRange(start,end) {
                return await page.evaluate(async ({start,end}) => {
                  const cards=Array.from(document.querySelectorAll('.feed-card')).slice(start,end);
                  const results=await Promise.all(cards.map(async card=>{
                    const image=card.querySelector('.feed-media img');
                    const video=card.dataset.videoSrc||'';
                    const status=card.dataset.previewStatus||'';
                    const id=card.dataset.entryId||'';
                    const playerUrl=card.dataset.playerUrl||'';
                    let poster='',decoded=false,httpStatus=0,posterBytes=0,webp=false;
                    if(image){
                      image.loading='eager';
                      poster=image.currentSrc||image.src||'';
                      try{
                        await image.decode();
                        decoded=image.naturalWidth>0&&image.naturalHeight>0;
                      }catch{}
                      try{
                        const response=await fetch(poster,{cache:'no-store'});
                        const bytes=new Uint8Array(await response.arrayBuffer());
                        httpStatus=response.status;
                        posterBytes=bytes.length;
                        webp=bytes.length>=12&&
                          String.fromCharCode(...bytes.subarray(0,4))==='RIFF'&&
                          String.fromCharCode(...bytes.subarray(8,12))==='WEBP';
                      }catch{}
                    }
                    return {id,playerUrl,poster,video,status,hasImage:Boolean(image),
                      decoded,httpStatus,posterBytes,webp,
                      fallback:Boolean(card.querySelector('[data-fallback-src],[data-video-fallback],.feed-placeholder,.media-fallback'))};
                  }));
                  await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
                  return results;
                },{start,end});
              }
              const allDomRows=await decodeCardRange(0,40);
              let scannedCards=40,batches=0,videoSamples=0;
              async function verifyPlaybackSample(index) {
                const sampleCard=page.locator('.feed-card').nth(index);
                await sampleCard.evaluate(element=>element.scrollIntoView({block:'start'}));
                const sampleVideo=sampleCard.locator('video').first();
                await sampleVideo.waitFor({state:'attached',timeout:8000});
                await page.waitForFunction(video=>
                  video.readyState>=2&&!video.paused&&video.currentTime>0,
                  await sampleVideo.elementHandle(),{timeout:8000});
                const startTime=await sampleVideo.evaluate(video=>video.currentTime);
                await page.waitForTimeout(450);
                const playback=await sampleVideo.evaluate(video=>({
                  currentTime:video.currentTime,paused:video.paused,readyState:video.readyState,
                  width:video.videoWidth,height:video.videoHeight,
                }));
                assert.ok(playback.readyState>=2&&!playback.paused&&playback.width>0&&playback.height>0&&
                  playback.currentTime!==startTime,
                  'A sampled archive WebM did not produce advancing decoded video frames');
              }
              const firstSampleIndex=allDomRows.findIndex(row=>row.video);
              if(firstSampleIndex>=0){
                await verifyPlaybackSample(firstSampleIndex);
                videoSamples++;
              }
              while(scannedCards<expectedTotal){
                const sentinel=page.locator('#sentinel');
                await sentinel.scrollIntoViewIfNeeded();
                const beforeCount=scannedCards;
                let progressed=false;
                for(let attempt=0;attempt<3;attempt++){
                  await page.waitForFunction(({before,total})=>{
                    const count=document.querySelectorAll('.feed-card').length;
                    const label=document.querySelector('#sentinel')?.textContent?.trim()||'';
                    return count>before||count>=total||label==='Tap to retry'||label==='End of archive';
                  },{before:beforeCount,total:expectedTotal},{timeout:12000});
                  const currentCount=await page.locator('.feed-card').count();
                  const label=(await sentinel.innerText()).trim();
                  if(currentCount>beforeCount){
                    scannedCards=currentCount;
                    progressed=true;
                    break;
                  }
                  if(label==='End of archive')break;
                  if(label==='Tap to retry'){
                    await sentinel.click();
                    continue;
                  }
                }
                if(!progressed){
                  const label=(await sentinel.innerText()).trim();
                  if(label==='End of archive'&&scannedCards===expectedTotal)break;
                  throw new Error('Archive pagination stopped before the final page');
                }
                assert.ok(scannedCards<=expectedTotal,'Archive exposed more cards than its indexed total');
                const batchRows=await decodeCardRange(beforeCount,scannedCards);
                allDomRows.push(...batchRows);
                const sampleIndex=batchRows.findIndex(row=>row.video);
                if(sampleIndex>=0){
                  await verifyPlaybackSample(beforeCount+sampleIndex);
                  videoSamples++;
                }
                batches++;
              }
              assert.equal(scannedCards,expectedTotal,'Not all archive pages were traversed');
              assert.equal(allDomRows.length,expectedTotal,'Not all archive cards were inspected');
              await page.waitForFunction(()=>document.querySelector('#sentinel')?.textContent?.trim()==='End of archive',undefined,{timeout:5000});
              const cardRows=await page.locator('.feed-card').evaluateAll(cards=>cards.map(card=>({
                id:card.dataset.entryId||'',
                playerUrl:card.dataset.playerUrl||'',
                poster:card.querySelector('.feed-media img')?.currentSrc||card.querySelector('.feed-media img')?.src||'',
                video:card.dataset.videoSrc||'',
                status:card.dataset.previewStatus||'',
                fallback:Boolean(card.querySelector('[data-fallback-src],[data-video-fallback],.feed-placeholder,.media-fallback')),
              })));
              const invalidCards=cardRows.filter(row=>{
                if(!row.poster&&!row.video)return !row.status.startsWith('blocked-')||row.fallback;
                if(!row.poster||!row.video||row.fallback||row.status!=='ready-poster-lazy-video')return true;
                try{
                  const poster=new URL(row.poster),video=new URL(row.video),player=new URL(row.playerUrl,site);
                  const videoName=video.pathname.split('/').pop().toLowerCase();
                  const posterName=poster.pathname.split('/').pop().toLowerCase();
                  const playerId=decodeURIComponent(player.pathname.split('/').pop()||'');
                  return !['preview-medium.webm','preview-low.webm'].includes(videoName)||
                    posterName!==videoName.replace(/\.webm$/,'.webp')||
                    poster.pathname.slice(0,poster.pathname.lastIndexOf('/'))!==
                      video.pathname.slice(0,video.pathname.lastIndexOf('/'))||
                    !player.searchParams.get('animation')||playerId!==row.id;
                }catch{return true;}
              });
              assert.deepEqual(invalidCards,[],'An archive card has mismatched media, no exact animation link, or an unblocked empty state');
              assert.ok(allDomRows.every(row=>!row.hasImage||
                (row.decoded&&row.httpStatus===200&&row.posterBytes>128&&row.webp)),
                'At least one archive poster failed HTTP, byte-signature, or browser decode validation');
              assert.ok(allDomRows.every(row=>row.hasImage===Boolean(row.poster)&&
                Boolean(row.poster)===Boolean(row.video)&&!row.fallback),
                'An archive card contains partial or fallback media');
              const lazyRequestEvidence=mediaRequests.slice();
              const earlyVideos=lazyRequestEvidence.filter(request=>request.type==='webm').filter(request=>{
                const videoUrl=new URL(request.url);
                const expectedPosterPath=videoUrl.pathname.replace(/\.webm$/i,'.webp');
                return !lazyRequestEvidence.some(candidate=>candidate.type==='webp'&&
                  new URL(candidate.url).pathname===expectedPosterPath&&candidate.at<=request.at);
              });
              assert.deepEqual(earlyVideos,[],'A WebM request occurred before its exact paired WebP poster');
              const videoUrls=Array.from(new Set(cardRows.map(row=>row.video).filter(Boolean)));
              const videoChecks=[];
              for(let offset=0;offset<videoUrls.length;offset+=12){
                const part=await page.evaluate(async urls=>{
                  const results=[];
                  for(let i=0;i<urls.length;i+=6){
                    const batch=await Promise.all(urls.slice(i,i+6).map(async url=>{
                      try{
                        const response=await fetch(url,{headers:{Range:'bytes=0-63'},cache:'no-store'});
                        const reader=response.body?.getReader();
                        const first=reader?await reader.read():{value:new Uint8Array()};
                        if(reader)await reader.cancel().catch(()=>{});
                        const bytes=first.value||new Uint8Array();
                        return {status:response.status,bytes:bytes.length,
                          webm:bytes.length>=4&&bytes[0]===0x1a&&bytes[1]===0x45&&bytes[2]===0xdf&&bytes[3]===0xa3};
                      }catch{return {status:0,bytes:0,webm:false};}
                    }));
                    results.push(...batch);
                  }
                  return results;
                },videoUrls.slice(offset,offset+12));
                videoChecks.push(...part);
              }
              const badVideos=videoChecks.filter(item=>![200,206].includes(item.status)||!item.webm);
              assert.deepEqual(badVideos,[],'At least one archive WebM is missing or not a real WebM container');
              assert.ok(videoSamples>0||videoUrls.length===0,'No sampled archive video reached actual playback');
              assert.deepEqual(pageErrors,[],'Production gallery JavaScript errors after full pagination');
              console.log('ARCHIVE_ALL_PAGES_EVIDENCE '+JSON.stringify({
                viewport:viewport.width,total:expectedTotal,batches,
                postersDecoded:allDomRows.filter(row=>row.hasImage&&row.decoded).length,
                pairedCards:cardRows.filter(row=>row.poster&&row.video).length,
                blockedCards:cardRows.filter(row=>!row.poster&&!row.video).length,
                videoAssetsVerified:videoChecks.length,videoPlaybackSamples:videoSamples,
                lazyWebmRequests:lazyRequestEvidence.filter(row=>row.type==='webm').length,
              }));

              } finally {
                await page.close();
              }
            }
          } finally {
            await browser.close();
          }
          NODE
