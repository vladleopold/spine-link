# Live benchmark after deploying all-page embedded archive metadata.
name: Spine archive live one-second lazy-card browser proof
on:
  schedule:
    - cron: '43 * * * *'
  workflow_run:
    workflows: ["Vercel deploy and alias"]
    types: [completed]
  workflow_dispatch:
  pull_request:
    paths:
      - api/github-archive.js
      - tests/archive-speed.test.mjs
      - tests/archive-initial-timing.test.mjs
      - scripts/resolve-vercel-preview-comment.mjs
      - .github/workflows/archive-live-speed.yml
permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read
  statuses: read
concurrency:
  group: spine-archive-live-proof
  cancel-in-progress: false
jobs:
  release_gate:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    outputs:
      deployed: ${{ steps.inspect.outputs.deployed }}
    steps:
      - name: Confirm upstream run performed a real production deployment
        id: inspect
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/jobs?per_page=100")"
          deployed="$(printf '%s' "$jobs" | jq -r '[.jobs[].steps[]? | select(.name == "Deploy to Vercel" and .conclusion == "success")] | length > 0')"
          echo "deployed=$deployed" >> "$GITHUB_OUTPUT"
          echo "REAL_PRODUCTION_DEPLOY=$deployed"
  chromium:
    needs: release_gate
    if: ${{ always() && (github.event_name != 'workflow_run' || needs.release_gate.outputs.deployed == 'true') }}
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    timeout-minutes: 25
    env:
      SITE: https://spine-link.vercel.app
    steps:
      - uses: actions/checkout@v4
      - name: Resolve the ready Vercel preview for this exact PR commit
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { findMatchingVercelProject } from './scripts/resolve-vercel-preview-comment.mjs';

          const token = process.env.GH_TOKEN;
          const repository = process.env.GITHUB_REPOSITORY;
          const pullNumber = process.env.PR_NUMBER;
          const expectedSha = process.env.EXPECTED_SHA;
          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: 'Bearer ' + token,
            'X-GitHub-Api-Version': '2022-11-28',
          };
          async function githubJson(path) {
            const response = await fetch('https://api.github.com' + path, { headers });
            if (!response.ok) throw new Error('GitHub API returned ' + response.status + ' for ' + path);
            return response.json();
          }

          for (let attempt = 0; attempt < 30; attempt += 1) {
            const [comments, statuses] = await Promise.all([
              githubJson('/repos/' + repository + '/issues/' + pullNumber + '/comments?per_page=100'),
              githubJson('/repos/' + repository + '/statuses/' + expectedSha),
            ]);
            const vercelStatus = statuses.find((item) => item.context === 'Vercel');
            const project = findMatchingVercelProject(comments, vercelStatus?.target_url);
            const inspector = project?.inspectorUrl || '';
            const preview = project?.previewUrl || '';
            const deploymentStatus = project?.nextCommitStatus || '';

            if (preview && vercelStatus?.target_url && inspector === vercelStatus.target_url &&
                deploymentStatus === 'DEPLOYED' && vercelStatus.state === 'success') {
              const previewUrl = new URL(preview);
              if (!/^spine-link-git-.*-leopoldus-projects\.vercel\.app$/.test(previewUrl.hostname)) {
                throw new Error('Unexpected Vercel preview host');
              }
              appendFileSync(process.env.GITHUB_ENV, 'SITE=' + previewUrl.origin + '\n');
              console.log('VERCEL_PREVIEW_READY=' + previewUrl.origin);
              process.exit(0);
            }
            if (vercelStatus?.state === 'failure' && vercelStatus?.target_url) {
              const failureCode = vercelStatus.target_url.includes('build-rate-limit')
                ? 'BUILD_RATE_LIMIT'
                : 'DEPLOYMENT_FAILED';
              throw new Error('VERCEL_PREVIEW_BLOCKED=' + failureCode + ' SHA=' + expectedSha);
            }
            if (vercelStatus?.target_url && inspector === vercelStatus.target_url && deploymentStatus === 'ERROR') {
              throw new Error('Vercel preview deployment failed for this PR commit');
            }
            await new Promise((resolve) => setTimeout(resolve, 10000));
          }
          throw new Error('Timed out waiting for a Vercel preview for ' + expectedSha);
          NODE
      - name: Install Playwright
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify poster-first lazy pagination for desktop and mobile
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          try {
            for(const viewport of [{width:1280,height:800},{width:390,height:844}]){
              const page=await browser.newPage({viewport});
              const pageErrors=[],mediaRequests=[],assetHttpErrors=[];
              const posterResponseStatuses=new Map();
              let blockedApiRequests=0,allowedApiRequests=0;
              // Prove the first lazy page is supplied in HTML, without
              // relying on a warm GitHub feed endpoint at all.
              await page.route(url=>url.pathname==='/api/github-archive' &&
                url.searchParams.get('feed')==='archive',route=>{
                const requestUrl=new URL(route.request().url());
                const offset=Number(requestUrl.searchParams.get('offset')||0);
                if(offset<40){blockedApiRequests++;return route.abort();}
                allowedApiRequests++;
                return route.continue();
              });
              page.on('pageerror',e=>pageErrors.push(String(e)));
              page.on('response',response=>{
                const url=response.url();
                if(/\\.webp(?:\\?|$)/i.test(url))posterResponseStatuses.set(url,response.status());
                if(response.status()>=400 && (/\\.(?:webm|webp)(?:\\?|$)/i.test(url)||url.includes('/api/github-archive')))
                  assetHttpErrors.push(response.status());
              });
              page.on('request',r=>{
                if(/\.(?:webm|webp)(?:\?|$)/.test(r.url()))mediaRequests.push({
                  url:r.url(),type:/\.webm(?:\?|$)/.test(r.url())?'webm':'webp',at:Date.now()
                });
              });
              try {
                const site=(process.env.SITE||'https://spine-link.vercel.app').replace(/\/+$/,'');
                const started=Date.now();
                const response=await page.goto(site+'/world-spine-archive',{
                  waitUntil:'domcontentloaded',timeout:45000,
                });
                assert.equal(response?.status(),200);
                const firstHtml=await page.content();
                assert.match(firstHtml,/data-video-src=/,'No deferred video data on gallery cards');
                assert.ok(!firstHtml.includes('<video src="'),'Initial cards must never eagerly load WebM');
                await page.waitForFunction(()=>{
                  const img=document.querySelector('.feed-card img');
                  return img&&img.complete&&img.naturalWidth>0;
                },{timeout:20000});
                await page.locator('.feed-card img').first().evaluate(img=>img.decode());
                const initialPosterMs=Date.now()-started;
                const initialTiming=await page.evaluate(()=>{
                  const nav=performance.getEntriesByType('navigation')[0];
                  const img=document.querySelector('.feed-card img');
                  const resource=img?performance.getEntriesByName(img.currentSrc||img.src).filter(x=>x.entryType==='resource').at(-1):null;
                  return {
                    responseStartMs:Math.round(nav?.responseStart||0),
                    domContentLoadedMs:Math.round(nav?.domContentLoadedEventEnd||0),
                    posterStartMs:Math.round(resource?.startTime||0),
                    posterEndMs:Math.round(resource?.responseEnd||0),
                    posterTransferBytes:Math.round(resource?.transferSize||0),
                  };
                });
                console.log('ARCHIVE_INITIAL_POSTER_EVIDENCE '+JSON.stringify({
                  viewport:viewport.width,initialMs:initialPosterMs,...initialTiming
                }));
                assert.ok(initialPosterMs<=1000,
                  'First archive card WebP did not decode within one second: '+initialPosterMs+'ms');
                // Capture initial visibility BEFORE the deliberate 1.9s warm-up.
                // The old initialMs included this sleep and misreported page latency.
                const firstWebp=mediaRequests.find(r=>r.type==='webp');
                const firstWebm=mediaRequests.find(r=>r.type==='webm');
                if(firstWebm&&firstWebp)assert.ok(firstWebm.at>=firstWebp.at,
                  'WebM requested before WebP');
                // Normal users spend time looking at the first cards, which is
                // when the one-page-ahead JSON and six WebP posters are warmed.
                await page.waitForTimeout(1900);
                const before=await page.locator('.feed-card').count();
              const scrollStart=Date.now();
              await page.locator('#sentinel').scrollIntoViewIfNeeded();
              await page.waitForFunction(n=>document.querySelectorAll('.feed-card').length>n,
                before,{timeout:9500});
              const latency=Date.now()-scrollStart;
              await page.waitForFunction(n=>{
                const newCards=Array.from(document.querySelectorAll('.feed-card')).slice(n,n+6);
                return newCards.filter(card=>{
                  const image=card.querySelector('img');
                  return image && image.complete && image.naturalWidth>0;
                }).length>=3;
              },before,{timeout:9000});
              const posterMs=Date.now()-scrollStart;
              const after=await page.locator('.feed-card').count();
              assert.ok(after>before);
              assert.equal(pageErrors.length,0,'Production gallery JavaScript error count: '+pageErrors.length);
              // Continue through the live archive until the first 40 newest
              // public animation cards are present in the DOM.
              while(await page.locator('.feed-card').count()<40){
                const previous=await page.locator('.feed-card').count();
                await page.locator('#sentinel').scrollIntoViewIfNeeded();
                await page.waitForFunction(n=>document.querySelectorAll('.feed-card').length>n,
                  previous,{timeout:12000});
              }
              const first40=await page.locator('.feed-card').evaluateAll(cards=>cards.slice(0,40).map(card=>{
                const image=card.querySelector('.feed-media img');
                const video=card.dataset.videoSrc||'';
                const poster=image?.getAttribute('src')||'';
                return {
                  id:card.dataset.entryId||'',
                  status:card.dataset.previewStatus||'',
                  sourceWebmStatus:card.dataset.sourceWebmStatus||'',
                  sourcePreviewStatus:card.dataset.sourcePreviewStatus||'',
                  video,poster,
                  imageCount:card.querySelectorAll('.feed-media img').length,
                  fallback:!!card.querySelector('[data-fallback-src],[data-video-fallback],.feed-placeholder,.media-fallback'),
                  mediaText:(card.querySelector('.feed-media')?.textContent||'').trim(),
                };
              }));
              assert.equal(first40.length,40,'Archive did not expose 40 newest cards');
              const paired=first40.filter(item=>item.video&&item.poster);
              const badPairs=first40.filter(item=>{
                if(!item.video&&!item.poster)return false;
                if(!item.video||!item.poster||item.imageCount!==1)return true;
                try{
                  const video=new URL(item.video),poster=new URL(item.poster);
                  const videoName=video.pathname.split('/').pop().toLowerCase();
                  const posterName=poster.pathname.split('/').pop().toLowerCase();
                  return !['preview-medium.webm','preview-low.webm'].includes(videoName)||
                    posterName!==videoName.replace(/\.webm$/,'.webp')||
                    video.pathname.slice(0,video.pathname.lastIndexOf('/')+1)!==
                      poster.pathname.slice(0,poster.pathname.lastIndexOf('/')+1);
                }catch{return true;}
              });
              const fallbacks=first40.filter(item=>item.fallback||item.mediaText);
              const newest20=first40.slice(0,20);
              const newest20Missing=newest20.filter(item=>!item.video||!item.poster);
              const newest20Blocked=newest20.filter(item=>
                item.sourceWebmStatus.startsWith('blocked-')&&
                item.sourcePreviewStatus==='blocked'&&!item.video&&!item.poster);
              const newest20UnexpectedMissing=newest20Missing.filter(item=>!newest20Blocked.includes(item));
              const newest20InvalidBlocked=newest20.filter(item=>
                item.sourceWebmStatus.startsWith('blocked-')&&
                item.sourcePreviewStatus==='blocked'&&(item.video||item.poster));
              const older20Missing=first40.slice(20,40).filter(item=>!item.video||!item.poster);
              // Every eligible newest card must have its own WebM/WebP pair.
              // Explicitly blocked source records remain blank; never guess an
              // animation or substitute an unrelated texture as a fake preview.
              assert.equal(badPairs.length,0,'Mismatched video/poster pairs in first 40 cards: '+badPairs.length);
              assert.equal(fallbacks.length,0,'Forbidden image/text fallbacks in first 40 cards: '+fallbacks.length);
              const checks=await Promise.all(paired.map(async item=>{
                const [posterResponse,videoResponse]=await Promise.all([
                  page.request.get(item.poster,{headers:{Range:'bytes=0-63'},timeout:20000}),
                  page.request.get(item.video,{headers:{Range:'bytes=0-63'},timeout:20000}),
                ]);
                const [posterBytes,videoBytes]=await Promise.all([posterResponse.body(),videoResponse.body()]);
                return {
                  posterStatus:posterResponse.status(),
                  videoStatus:videoResponse.status(),
                  webp:posterBytes.length>=12&&posterBytes.subarray(0,4).toString('ascii')==='RIFF'&&
                    posterBytes.subarray(8,12).toString('ascii')==='WEBP',
                  webm:videoBytes.length>=4&&videoBytes.subarray(0,4).equals(Buffer.from([0x1a,0x45,0xdf,0xa3])),
                };
              }));
              const broken=checks.filter(x=>![200,206].includes(x.posterStatus)||
                ![200,206].includes(x.videoStatus)||!x.webp||!x.webm);
              console.log('ARCHIVE_FIRST40_EVIDENCE '+JSON.stringify({
                viewport:viewport.width,initialMs:initialPosterMs,initialTiming,appendMs:latency,posterMs,
                before,after,checked:checks.length,newest20Ready:20-newest20Blocked.length,newest20Blocked:newest20Blocked.length,
                older20Ready:20-older20Missing.length,older20Missing:older20Missing.length,
                blockedApiRequests,webpRequests:mediaRequests.filter(x=>x.type==='webp').length,
                webmRequests:mediaRequests.filter(x=>x.type==='webm').length,
                brokenAssets:broken,
              }));
              assert.equal(newest20UnexpectedMissing.length,0,
                'Eligible newest-20 cards missing their own WebM/WebP pair: '+newest20UnexpectedMissing.length);
              assert.equal(newest20InvalidBlocked.length,0,
                'Blocked newest-20 cards exposing partial preview media: '+newest20InvalidBlocked.length);
              assert.equal(newest20Missing.length,newest20Blocked.length,
                'Every newest-20 missing preview must have an explicit blocked status');
              assert.equal(broken.length,0,'Broken media assets in first 40 cards: '+broken.length);
              assert.ok(latency<=1000,'Next card batch took more than 1 second to appear: '+latency+'ms');
              assert.ok(posterMs<=1000,'Three new WebP posters took over one second: '+posterMs+'ms');
              // Continue through every public archive page; the first 40 cards are
              // embedded in HTML, while every later batch must come from the paginated API.
              const totalEntries=await page.evaluate(()=>{
                const raw=document.querySelector('.legend span')?.textContent||'';
                return Number(raw.match(/\d+/)?.[0]||0);
              });
              assert.ok(totalEntries>=40,'Archive total is missing or below the embedded batch');
              let allPageBatches=0;
              const appendLatencies=[];
              let maxBatchPosterMs=0;
              while(true){
                const state=(await page.locator('#sentinel').innerText()).trim();
                if(state==='End of archive')break;
                const previous=await page.locator('.feed-card').count();
                const started=Date.now();
                const sentinel=page.locator('#sentinel');
                await sentinel.scrollIntoViewIfNeeded();
                await sentinel.click({timeout:5000}).catch(()=>{});
                await page.waitForFunction(n=>{
                  const count=document.querySelectorAll('.feed-card').length;
                  const text=document.querySelector('#sentinel')?.textContent?.trim();
                  return count>n||text==='End of archive'||text==='Tap to retry';
                },previous,{timeout:15000});
                let after=await page.locator('.feed-card').count();
                let nextState=(await sentinel.innerText()).trim();
                if(after===previous&&nextState==='Tap to retry'){
                  await sentinel.click({timeout:5000});
                  await page.waitForFunction(n=>{
                    const count=document.querySelectorAll('.feed-card').length;
                    const text=document.querySelector('#sentinel')?.textContent?.trim();
                    return count>n||text==='End of archive';
                  },previous,{timeout:15000});
                  after=await page.locator('.feed-card').count();
                  nextState=(await sentinel.innerText()).trim();
                }
                if(after===previous&&nextState!=='End of archive')
                  throw Error('Archive pagination stalled before the end of the public collection');
                if(after>previous){
                  const appendMs=Date.now()-started;
                  appendLatencies.push(appendMs);
                  assert.ok(appendMs<=1000,'Archive page append exceeded one second: '+appendMs+'ms');
                  const eagerCount=await page.locator('.feed-card').evaluateAll((cards,start)=>
                    cards.slice(start,start+12).slice(0,6).filter(card=>card.querySelector('img')).length,previous);
                  if(eagerCount>0){
                    const required=Math.min(3,eagerCount);
                    const posterStarted=Date.now();
                    await page.waitForFunction(({start,required})=>{
                      const cards=Array.from(document.querySelectorAll('.feed-card')).slice(start,start+12).slice(0,6);
                      const images=cards.map(card=>card.querySelector('img')).filter(Boolean);
                      return images.filter(img=>img.complete&&img.naturalWidth>0).length>=required;
                    },{start:previous,required},{timeout:5000});
                    const batchPosterMs=Date.now()-posterStarted;
                    maxBatchPosterMs=Math.max(maxBatchPosterMs,batchPosterMs);
                    assert.ok(batchPosterMs<=1000,'New archive WebP posters exceeded one second: '+batchPosterMs+'ms');
                  }
                }
                allPageBatches++;
                assert.ok(allPageBatches<=Math.ceil(totalEntries/12)+3,'Archive pagination exceeded its bounded page count');
              }
              assert.equal(await page.locator('.feed-card').count(),totalEntries,
                'Archive traversal must reach every public card, not only the newest batch');

              // Decode every WebP on desktop; on mobile decode the first 12 here,
              // then decode each sampled card immediately before testing playback.
              const decodeLimit=viewport.width>1000?Number.MAX_SAFE_INTEGER:12;
              const posterDecode=await page.evaluate(async limit=>{
                const images=Array.from(document.querySelectorAll('.feed-card img')).slice(0,limit);
                images.forEach(image=>{image.loading='eager';});
                const decoded=await Promise.all(images.map(async image=>{
                  try{await image.decode();return image.naturalWidth>0&&image.naturalHeight>0;}
                  catch{return false;}
                }));
                return {total:images.length,failed:decoded.filter(ok=>!ok).length};
              },decodeLimit);
              if(viewport.width>1000)
                assert.equal(posterDecode.failed,0,'Undecodable desktop WebP posters: '+posterDecode.failed);
              else
                assert.ok(posterDecode.total===0||posterDecode.failed===0,
                  'Undecodable mobile WebP posters: '+posterDecode.failed);

              const allCards=await page.locator('.feed-card').evaluateAll(cards=>cards.map((card,index)=>{
                const image=card.querySelector('.feed-media img');
                return {
                  index,
                  id:card.dataset.entryId||'',
                  sourceWebmStatus:card.dataset.sourceWebmStatus||'',
                  sourcePreviewStatus:card.dataset.sourcePreviewStatus||'',
                  video:card.dataset.videoSrc||'',
                  poster:image?(image.currentSrc||image.getAttribute('src')||''):'',
                  imageCount:card.querySelectorAll('.feed-media img').length,
                  fallback:!!card.querySelector('[data-fallback-src],[data-video-fallback],.feed-placeholder,.media-fallback'),
                  mediaText:(card.querySelector('.feed-media')?.textContent||'').trim(),
                };
              }));
              assert.equal(allCards.length,totalEntries,'All archive cards must be present in the final DOM');
              const allPairs=allCards.filter(item=>item.video&&item.poster);
              const allMissing=allCards.filter(item=>!item.video||!item.poster);
              const allBlocked=allMissing.filter(item=>!item.video&&!item.poster&&
                item.sourceWebmStatus.startsWith('blocked-')&&item.sourcePreviewStatus==='blocked');
              const allUnexpectedMissing=allMissing.filter(item=>!allBlocked.includes(item));
              const allInvalidBlocked=allCards.filter(item=>
                item.sourceWebmStatus.startsWith('blocked-')&&item.sourcePreviewStatus==='blocked'&&
                (item.video||item.poster));
              const allBadPairs=allCards.filter(item=>{
                if(!item.video&&!item.poster)return false;
                if(!item.video||!item.poster||item.imageCount!==1)return true;
                try{
                  const video=new URL(item.video),poster=new URL(item.poster);
                  const videoName=video.pathname.split('/').pop().toLowerCase();
                  const posterName=poster.pathname.split('/').pop().toLowerCase();
                  return !['preview-medium.webm','preview-low.webm'].includes(videoName)||
                    posterName!==videoName.replace(/\.webm$/,'.webp')||
                    video.pathname.slice(0,video.pathname.lastIndexOf('/')+1)!==
                      poster.pathname.slice(0,poster.pathname.lastIndexOf('/')+1);
                }catch{return true;}
              });
              const allFallbacks=allCards.filter(item=>item.fallback||item.mediaText);
              assert.equal(allUnexpectedMissing.length,0,
                'Public cards missing media without an explicit blocked source status: '+allUnexpectedMissing.length);
              assert.equal(allInvalidBlocked.length,0,
                'Blocked public cards exposing partial media: '+allInvalidBlocked.length);
              assert.equal(allBadPairs.length,0,'Mismatched public WebM/WebP pairs: '+allBadPairs.length);
              assert.equal(allFallbacks.length,0,'Forbidden public archive fallbacks: '+allFallbacks.length);
              assert.equal(blockedApiRequests,0,'Embedded first 40 cards unexpectedly called the feed API');
              assert.ok(allowedApiRequests>0,'Later archive pages were not fetched through the paginated API');
              assert.equal(assetHttpErrors.length,0,'Archive media/API HTTP errors: '+assetHttpErrors.length);

              const pairedBeyondEmbedded=allPairs.filter(item=>item.index>=40);
              let webmProbeFailures=0,webmProbed=0;
              async function probeWebm(url){
                try{
                  const response=await fetch(url,{headers:{Range:'bytes=0-63','Cache-Control':'no-cache'},
                    signal:AbortSignal.timeout(20000)});
                  if(![200,206].includes(response.status)){
                    await response.body?.cancel();
                    return {ok:false,status:response.status};
                  }
                  const reader=response.body?.getReader();
                  let prefix=new Uint8Array(0);
                  while(prefix.length<4){
                    const part=await reader.read();
                    if(part.done)break;
                    const next=new Uint8Array(prefix.length+part.value.length);
                    next.set(prefix);next.set(part.value,prefix.length);prefix=next;
                  }
                  await reader?.cancel().catch(()=>{});
                  const type=response.headers.get('content-type')||'';
                  return {ok:prefix.length>=4&&prefix[0]===0x1a&&prefix[1]===0x45&&
                    prefix[2]===0xdf&&prefix[3]===0xa3&&type.includes('video/webm'),status:response.status};
                }catch{return {ok:false,status:0};}
              }
              const webmTargets=viewport.width>1000?pairedBeyondEmbedded:
                pairedBeyondEmbedded.filter(item=>item.index<52);
              for(let i=0;i<webmTargets.length;i+=8){
                const batch=await Promise.all(webmTargets.slice(i,i+8).map(item=>probeWebm(item.video)));
                webmProbed+=batch.length;
                webmProbeFailures+=batch.filter(result=>!result.ok).length;
              }
              assert.equal(webmProbeFailures,0,'Invalid or unavailable later-page WebM byte streams: '+webmProbeFailures);

              const sampleCount=Math.min(viewport.width>1000?8:2,allPairs.length);
              assert.ok(sampleCount>0,'Archive has no eligible exact WebM/WebP pairs');
              const samplePositions=[...new Set(Array.from({length:sampleCount},(_,i)=>
                Math.round(i*(allPairs.length-1)/Math.max(1,sampleCount-1))))];
              let playedSamples=0;
              for(const position of samplePositions){
                const sample=allPairs[position];
                const card=page.locator('.feed-card').nth(sample.index);
                await card.locator('img').evaluate(async image=>{
                  image.loading='eager';
                  await image.decode();
                });
                await card.scrollIntoViewIfNeeded();
                await page.waitForFunction(index=>{
                  const target=document.querySelectorAll('.feed-card')[index];
                  const video=target?.querySelector('video');
                  return video&&video.readyState>=2&&!video.paused&&video.videoWidth>0;
                },sample.index,{timeout:15000});
                const playback=await card.evaluate(element=>{
                  const image=element.querySelector('img');
                  const video=element.querySelector('video');
                  return {posterDecoded:!!image&&image.complete&&image.naturalWidth>0,
                    videoUrl:video?.currentSrc||'',readyState:video?.readyState||0,
                    paused:video?.paused??true,width:video?.videoWidth||0};
                });
                assert.ok(playback.posterDecoded&&playback.videoUrl===sample.video&&
                  playback.readyState>=2&&!playback.paused&&playback.width>0,
                  'Sample archive video failed real playback');
                const posterRequest=mediaRequests.find(request=>request.type==='webp'&&request.url===sample.poster);
                const videoRequest=mediaRequests.find(request=>request.type==='webm'&&request.url===sample.video);
                assert.ok(posterRequest&&videoRequest&&videoRequest.at>=posterRequest.at,
                  'Sample WebM was not requested after its own WebP poster');
                assert.ok([200,206].includes(posterResponseStatuses.get(sample.poster)),
                  'Sample WebP poster did not return a successful HTTP status');
                playedSamples++;
              }
              assert.equal(pageErrors.length,0,'Archive JavaScript error count: '+pageErrors.length);
              console.log('ARCHIVE_ALL_PAGES_EVIDENCE '+JSON.stringify({
                viewport:viewport.width,totalEntries,loadedCards:allCards.length,batches:allPageBatches,
                paired:allPairs.length,blocked:allBlocked.length,missing:allUnexpectedMissing.length,
                decodedPosters:posterDecode.total,posterDecodeFailures:posterDecode.failed,
                laterWebmProbed:webmProbed,webmProbeFailures,playedSamples,
                maxAppendMs:Math.max(0,...appendLatencies),maxBatchPosterMs,
                blockedApiRequests,allowedApiRequests,assetHttpErrors:assetHttpErrors.length,
                jsErrors:pageErrors.length
              }));
              } finally {
                await page.close();
              }
            }
          } finally {
            await browser.close();
          }
