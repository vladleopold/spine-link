# Live benchmark after deploying all-page embedded archive metadata.
name: Spine archive live one-second lazy-card browser proof
on:
  schedule:
    - cron: '17 * * * *'
  workflow_run:
    workflows: ["Vercel deploy and alias"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: spine-archive-hourly-live-audit
  cancel-in-progress: false
jobs:
  release_gate:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    outputs:
      deployed: ${{ steps.inspect.outputs.deployed }}
    steps:
      - name: Confirm upstream run performed a real production deployment
        id: inspect
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/jobs?per_page=100")"
          deployed="$(printf '%s' "$jobs" | jq -r '[.jobs[].steps[]? | select(.name == "Deploy to Vercel" and .conclusion == "success")] | length > 0')"
          echo "deployed=$deployed" >> "$GITHUB_OUTPUT"
          echo "REAL_PRODUCTION_DEPLOY=$deployed"
  chromium:
    needs: release_gate
    if: ${{ always() && (github.event_name != 'workflow_run' || needs.release_gate.outputs.deployed == 'true') }}
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify poster-first lazy pagination for desktop and mobile
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          try {
            for(const viewport of [{width:1280,height:800},{width:390,height:844}]){
              const page=await browser.newPage({viewport});
              const pageErrors=[],mediaRequests=[];
              let blockedApiRequests=0;
              // Prove the first lazy page is supplied in HTML, without
              // relying on a warm GitHub feed endpoint at all. Release this
              // route after the embedded first 40 cards so the full audit can
              // traverse every subsequent API-backed page.
              const archiveFeedMatcher=url=>url.pathname==='/api/github-archive' &&
                url.searchParams.get('feed')==='archive';
              const archiveFeedAbort=route=>{
                blockedApiRequests++;
                return route.abort();
              };
              await page.route(archiveFeedMatcher,archiveFeedAbort);
              page.on('pageerror',e=>pageErrors.push(e?.name||'page error'));
              const mediaResponses=[];
              page.on('request',r=>{
                if(/\.(?:webm|webp)(?:\?|$)/.test(r.url()))mediaRequests.push({
                  url:r.url(),type:/\.webm(?:\?|$)/.test(r.url())?'webm':'webp',at:Date.now()
                });
              });
              page.on('response',r=>{
                if(/\.(?:webm|webp)(?:\?|$)/.test(r.url())){
                  const type=r.url().match(/\.webm(?:\?|$)/)?'webm':'webp';
                  mediaResponses.push({url:r.url(),status:r.status(),type,
                    contentType:r.headers()['content-type']||''});
                }
              });
              try {
                const started=Date.now();
                const response=await page.goto('https://spine-link.vercel.app/world-spine-archive',{
                  waitUntil:'domcontentloaded',timeout:45000,
                });
                assert.equal(response?.status(),200);
                const firstHtml=await page.content();
                assert.match(firstHtml,/data-video-src=/,'No deferred video data on gallery cards');
                assert.ok(!firstHtml.includes('<video src="'),'Initial cards must never eagerly load WebM');
                await page.waitForFunction(()=>{
                  const img=document.querySelector('.feed-card img');
                  return img&&img.complete&&img.naturalWidth>0;
                },{timeout:20000});
                await page.locator('.feed-card img').first().evaluate(img=>img.decode());
                const initialPosterMs=Date.now()-started;
                const initialTiming=await page.evaluate(()=>{
                  const nav=performance.getEntriesByType('navigation')[0];
                  const img=document.querySelector('.feed-card img');
                  const resource=img?performance.getEntriesByName(img.currentSrc||img.src).filter(x=>x.entryType==='resource').at(-1):null;
                  return {
                    responseStartMs:Math.round(nav?.responseStart||0),
                    domContentLoadedMs:Math.round(nav?.domContentLoadedEventEnd||0),
                    posterStartMs:Math.round(resource?.startTime||0),
                    posterEndMs:Math.round(resource?.responseEnd||0),
                    posterTransferBytes:Math.round(resource?.transferSize||0),
                  };
                });
                console.log('ARCHIVE_INITIAL_POSTER_EVIDENCE '+JSON.stringify({
                  viewport:viewport.width,initialMs:initialPosterMs,...initialTiming
                }));
                assert.ok(initialPosterMs<=1000,
                  'First archive card WebP did not decode within one second: '+initialPosterMs+'ms');
                // Capture initial visibility BEFORE the deliberate 1.9s warm-up.
                // The old initialMs included this sleep and misreported page latency.
                const firstWebp=mediaRequests.find(r=>r.type==='webp');
                const firstWebm=mediaRequests.find(r=>r.type==='webm');
                if(firstWebm&&firstWebp)assert.ok(firstWebm.at>=firstWebp.at,
                  'WebM requested before WebP');
                // Normal users spend time looking at the first cards, which is
                // when the one-page-ahead JSON and six WebP posters are warmed.
                await page.waitForTimeout(1900);
                const before=await page.locator('.feed-card').count();
              const scrollStart=Date.now();
              await page.locator('#sentinel').scrollIntoViewIfNeeded();
              await page.waitForFunction(n=>document.querySelectorAll('.feed-card').length>n,
                before,{timeout:9500});
              const latency=Date.now()-scrollStart;
              await page.waitForFunction(n=>{
                const newCards=Array.from(document.querySelectorAll('.feed-card')).slice(n,n+6);
                return newCards.filter(card=>{
                  const image=card.querySelector('img');
                  return image && image.complete && image.naturalWidth>0;
                }).length>=3;
              },before,{timeout:9000});
              const posterMs=Date.now()-scrollStart;
              const after=await page.locator('.feed-card').count();
              assert.ok(after>before);
              assert.deepEqual(pageErrors,[],'Production gallery JavaScript errors');
              // The first 40 cards are embedded. Keep the initial 1s proof,
              // then release the feed route and walk every remaining page until
              // the server explicitly reports End of archive.
              while(await page.locator('.feed-card').count()<40){
                const previous=await page.locator('.feed-card').count();
                await page.locator('#sentinel').scrollIntoViewIfNeeded();
                await page.waitForFunction(n=>document.querySelectorAll('.feed-card').length>n,
                  previous,{timeout:12000});
              }
              await page.unroute(archiveFeedMatcher,archiveFeedAbort);
              const batchEvidence=[{cards:after,appendMs:latency,posterMs}];
              let archiveFinished=false;
              for(let batchIndex=0;batchIndex<200;batchIndex++){
                const sentinelText=await page.locator('#sentinel').innerText();
                if(sentinelText.includes('End of archive')){
                  archiveFinished=true;
                  break;
                }
                const previous=await page.locator('.feed-card').count();
                const batchStarted=Date.now();
                await page.locator('#sentinel').scrollIntoViewIfNeeded();
                await page.locator('#sentinel').click({timeout:5000}).catch(()=>{});
                await page.waitForFunction(n=>{
                  const count=document.querySelectorAll('.feed-card').length;
                  const state=document.querySelector('#sentinel')?.textContent||'';
                  return count>n||state.includes('End of archive')||state.includes('Tap to retry');
                },previous,{timeout:20000});
                let current=await page.locator('.feed-card').count();
                let state=await page.locator('#sentinel').innerText();
                if(current===previous&&state.includes('Tap to retry')){
                  await page.locator('#sentinel').click({timeout:5000});
                  await page.waitForFunction(n=>{
                    const count=document.querySelectorAll('.feed-card').length;
                    const label=document.querySelector('#sentinel')?.textContent||'';
                    return count>n||label.includes('End of archive')||label.includes('Tap to retry');
                  },previous,{timeout:20000});
                  current=await page.locator('.feed-card').count();
                  state=await page.locator('#sentinel').innerText();
                }
                if(current===previous&&state.includes('End of archive')){
                  archiveFinished=true;
                  break;
                }
                if(current===previous)
                  throw new Error('Archive pagination stalled before the end of the library');
                await page.waitForFunction(n=>{
                  const cards=Array.from(document.querySelectorAll('.feed-card')).slice(n);
                  const images=cards.map(card=>card.querySelector('.feed-media img')).filter(Boolean).slice(0,3);
                  return images.length===0||images.every(img=>img.complete&&img.naturalWidth>0);
                },previous,{timeout:10000});
                const elapsed=Date.now()-batchStarted;
                batchEvidence.push({cards:current-previous,appendMs:elapsed});
                assert.ok(elapsed<=1000,
                  'Archive card batch took more than one second to append and decode: '+elapsed+'ms');
              }
              assert.ok(archiveFinished,'Archive did not reach its explicit end sentinel');
              const allCards=await page.locator('.feed-card').evaluateAll(cards=>cards.map(card=>{
                const image=card.querySelector('.feed-media img');
                return {
                  status:card.dataset.previewStatus||'',
                  sourceWebmStatus:card.dataset.sourceWebmStatus||'',
                  sourcePreviewStatus:card.dataset.sourcePreviewStatus||'',
                  video:card.dataset.videoSrc||'',
                  poster:image?.getAttribute('src')||'',
                  imageCount:card.querySelectorAll('.feed-media img').length,
                  fallback:!!card.querySelector('[data-fallback-src],[data-video-fallback],.feed-placeholder,.media-fallback'),
                  mediaText:(card.querySelector('.feed-media')?.textContent||'').trim(),
                };
              }));
              const expectedTotal=await page.locator('.legend').evaluate(el=>
                Number(el.textContent.match(/(\d+)\s+works/i)?.[1]||0));
              assert.ok(expectedTotal>0,'Archive total card count is missing');
              assert.equal(allCards.length,expectedTotal,
                'Archive pagination did not expose every available card');
              const paired=allCards.filter(item=>item.video&&item.poster);
              const pairIssues=allCards.filter(item=>{
                if(!item.video&&!item.poster)return false;
                if(!item.video||!item.poster||item.imageCount!==1)return true;
                try{
                  const video=new URL(item.video),poster=new URL(item.poster);
                  const videoName=video.pathname.split('/').pop().toLowerCase();
                  const posterName=poster.pathname.split('/').pop().toLowerCase();
                  return !['preview-medium.webm','preview-low.webm'].includes(videoName)||
                    posterName!==videoName.replace(/\.webm$/,'.webp')||
                    video.pathname.slice(0,video.pathname.lastIndexOf('/')+1)!==
                      poster.pathname.slice(0,poster.pathname.lastIndexOf('/')+1);
                }catch{return true;}
              });
              const fallbacks=allCards.filter(item=>item.fallback||item.mediaText);
              const missing=allCards.filter(item=>!item.video||!item.poster);
              const unexpectedMissing=missing.filter(item=>
                !['blocked','failed'].includes(item.sourcePreviewStatus)&&
                !item.sourceWebmStatus.startsWith('blocked-')&&
                item.sourceWebmStatus!=='failed');
              const newest10Missing=allCards.slice(0,10).filter(item=>!item.video||!item.poster);
              const newest10UnexpectedMissing=newest10Missing.filter(item=>
                !['blocked','failed'].includes(item.sourcePreviewStatus)&&
                !item.sourceWebmStatus.startsWith('blocked-')&&
                item.sourceWebmStatus!=='failed');
              const posterUrls=[...new Set(paired.map(item=>item.poster))];
              const posterDecodeResults=[];
              for(let i=0;i<posterUrls.length;i+=8){
                const batch=await page.evaluate(async urls=>Promise.all(urls.map(async url=>{
                  try{
                    const image=Array.from(document.querySelectorAll('.feed-card img'))
                      .find(img=>img.currentSrc===url||img.src===url||img.getAttribute('src')===url);
                    if(image){image.loading='eager';await image.decode();}
                    const response=await fetch(url,{cache:'no-store'});
                    if(!response.ok)return {ok:false,status:response.status,bytes:0};
                    const type=response.headers.get('content-type')||'';
                    const blob=await response.blob();
                    const bitmap=await createImageBitmap(blob);
                    const result={ok:type.includes('image/webp')&&blob.size>128&&bitmap.width>0&&bitmap.height>0&&
                      (!image||(image.complete&&image.naturalWidth>0)),
                      status:response.status,bytes:blob.size,width:bitmap.width,height:bitmap.height};
                    bitmap.close();
                    return result;
                  }catch{return {ok:false,status:0,bytes:0};}
                })),posterUrls.slice(i,i+8));
                posterDecodeResults.push(...batch);
              }
              async function inspectWebmPrefix(url){
                try{
                  const response=await fetch(url,{headers:{Range:'bytes=0-63'},
                    signal:AbortSignal.timeout(20000),cache:'no-store'});
                  const reader=response.body?.getReader();
                  let prefix=Buffer.alloc(0);
                  if(reader){
                    while(prefix.length<4){
                      const part=await reader.read();
                      if(part.done)break;
                      prefix=Buffer.concat([prefix,Buffer.from(part.value)]);
                    }
                    await reader.cancel().catch(()=>{});
                  }
                  return {ok:[200,206].includes(response.status)&&
                    (response.headers.get('content-type')||'').includes('video/webm')&&
                    prefix.length>=4&&prefix.subarray(0,4).equals(Buffer.from([0x1a,0x45,0xdf,0xa3])),
                    status:response.status,bytes:prefix.length};
                }catch{return {ok:false,status:0,bytes:0};}
              }
              const webmProbeResults=[];
              for(let i=0;i<paired.length;i+=12)
                webmProbeResults.push(...await Promise.all(paired.slice(i,i+12).map(item=>inspectWebmPrefix(item.video))));
              const requestTimes=new Map();
              for(const request of mediaRequests)
                if(!requestTimes.has(request.url))requestTimes.set(request.url,request.at);
              const lazyOrderFailures=paired.filter(item=>{
                const videoAt=requestTimes.get(item.video);
                if(videoAt===undefined)return false;
                const posterAt=requestTimes.get(item.poster);
                return posterAt===undefined||videoAt<posterAt;
              });
              const mediaResponseFailures=mediaResponses.filter(item=>
                ![200,206,304].includes(item.status)||
                (item.status!==304&&(item.type==='webp'?!item.contentType.includes('image/webp'):!item.contentType.includes('video/webm'))));
              const pairedIndexes=allCards.map((item,index)=>item.video&&item.poster?index:-1).filter(index=>index>=0);
              const sampleIndexes=[...new Set([
                ...pairedIndexes.slice(0,10),
                ...pairedIndexes.filter((_,index)=>index%20===0),
                pairedIndexes.at(-1),
              ].filter(index=>Number.isInteger(index)&&index>=0))];
              const sampleItems=sampleIndexes.map(i=>({video:allCards[i].video,poster:allCards[i].poster}));
              const playbackSamples=await page.evaluate(async items=>{
                async function inspect(item){
                  const image=new Image();
                  image.src=item.poster;
                  await image.decode();
                  const video=document.createElement('video');
                  video.muted=true;
                  video.playsInline=true;
                  video.preload='auto';
                  const waitForData=new Promise((resolve,reject)=>{
                    const timer=setTimeout(()=>reject(new Error('video load timeout')),15000);
                    video.addEventListener('loadeddata',()=>{clearTimeout(timer);resolve();},{once:true});
                    video.addEventListener('error',()=>{clearTimeout(timer);reject(new Error('video decode failed'));},{once:true});
                  });
                  video.src=item.video;
                  video.load();
                  await waitForData;
                  const canvas=document.createElement('canvas');
                  canvas.width=32;canvas.height=32;
                  const context=canvas.getContext('2d',{willReadFrequently:true});
                  const pixels=source=>{
                    context.clearRect(0,0,32,32);
                    context.drawImage(source,0,0,32,32);
                    return context.getImageData(0,0,32,32).data;
                  };
                  const difference=(a,b)=>{
                    let total=0,count=0;
                    for(let i=0;i<a.length;i+=4){
                      total+=Math.abs(a[i]-b[i])+Math.abs(a[i+1]-b[i+1])+Math.abs(a[i+2]-b[i+2]);
                      count+=3;
                    }
                    return total/count;
                  };
                  const posterPixels=pixels(image);
                  const firstPixels=pixels(video);
                  const posterDiff=difference(posterPixels,firstPixels);
                  const before=video.currentTime;
                  const width=video.videoWidth,height=video.videoHeight,duration=video.duration;
                  await video.play();
                  const frameHashes=new Set();
                  let nonzeroFrames=0,frameChanges=0,previousPixels=firstPixels;
                  const hashFrame=data=>{
                    let hash=2166136261;
                    for(let i=0;i<data.length;i+=4){
                      hash^=data[i];hash=Math.imul(hash,16777619);
                      hash^=data[i+1];hash=Math.imul(hash,16777619);
                      hash^=data[i+2];hash=Math.imul(hash,16777619);
                    }
                    return hash>>>0;
                  };
                  const peak=data=>{
                    let value=0;
                    for(let i=0;i<data.length;i+=4)
                      value=Math.max(value,data[i],data[i+1],data[i+2]);
                    return value;
                  };
                  frameHashes.add(hashFrame(firstPixels));
                  if(peak(firstPixels)>12)nonzeroFrames++;
                  for(let frame=1;frame<8;frame++){
                    await new Promise(resolve=>{
                      if(typeof video.requestVideoFrameCallback==='function')
                        video.requestVideoFrameCallback(()=>resolve());
                      else setTimeout(resolve,120);
                    });
                    const currentPixels=pixels(video);
                    if(peak(currentPixels)>12)nonzeroFrames++;
                    if(difference(previousPixels,currentPixels)>0.2)frameChanges++;
                    frameHashes.add(hashFrame(currentPixels));
                    previousPixels=currentPixels;
                  }
                  const after=video.currentTime;
                  const motionDiff=difference(firstPixels,previousPixels);
                  video.pause();
                  video.removeAttribute('src');
                  video.load();
                  return {ok:width>0&&height>0&&duration>=0.5&&
                    after>before+0.05&&frameHashes.size>=8&&nonzeroFrames>=8&&
                    frameChanges>=7&&motionDiff>0.2&&posterDiff<=35,
                    width,height,duration,advanced:after>before+0.05,
                    distinctFrames:frameHashes.size,nonzeroFrames,frameChanges,motionDiff,posterDiff};
                }
                const results=[];
                for(const item of items){
                  try{results.push(await inspect(item));}
                  catch{results.push({ok:false,advanced:false,motionDiff:0,posterDiff:999});}
                }
                return results;
              },sampleItems);
              const posterFailures=posterDecodeResults.filter(x=>!x.ok);
              const webmFailures=webmProbeResults.filter(x=>!x.ok);
              const sampleFailures=playbackSamples.filter(x=>!x.ok);
              const maxAppendMs=Math.max(...batchEvidence.map(x=>x.appendMs));
              console.log('ARCHIVE_ALL_CARDS_EVIDENCE '+JSON.stringify({
                viewport:viewport.width,total:allCards.length,expectedTotal,
                batches:batchEvidence.length,maxAppendMs,
                paired:paired.length,missing:missing.length,unexpectedMissing:unexpectedMissing.length,
                newest10UnexpectedMissing:newest10UnexpectedMissing.length,
                postersDecoded:posterDecodeResults.length,posterFailures:posterFailures.length,
                webmProbed:webmProbeResults.length,webmFailures:webmFailures.length,
                lazyWebmRequests:mediaRequests.filter(x=>x.type==='webm').length,
                lazyOrderFailures:lazyOrderFailures.length,mediaResponseFailures:mediaResponseFailures.length,
                playbackSamples:playbackSamples.length,playbackFailures:sampleFailures.length,
                blockedApiRequests,pageErrors:pageErrors.length,initialMs:initialPosterMs,initialTiming,
              }));
              assert.deepEqual(pageErrors,[],'Production gallery JavaScript errors');
              assert.deepEqual(pairIssues,[],'Mismatched animation-specific WebM/WebP pairs across archive');
              assert.deepEqual(fallbacks,[],'Archive contains a fake image/text fallback');
              assert.deepEqual(unexpectedMissing,[],'A missing archive preview is not explicitly blocked/failed');
              assert.deepEqual(newest10UnexpectedMissing,[],'A newest-10 missing preview is not explicitly blocked/failed');
              assert.equal(posterFailures.length,0,'A card poster returned invalid bytes or failed WebP decoding');
              assert.equal(webmFailures.length,0,'A card WebM returned invalid bytes or content type');
              assert.equal(mediaResponseFailures.length,0,'A live archive WebP/WebM request returned an HTTP error');
              assert.equal(lazyOrderFailures.length,0,'A card WebM was requested before its own WebP poster');
              assert.ok(paired.length>=8,'Fewer than eight real archive preview pairs are available');
              assert.ok(playbackSamples.length>=8,'Fewer than eight representative WebM animations were decoded');
              assert.equal(sampleFailures.length,0,'A representative archive WebM failed 8-frame, first-frame-match or moving-playback acceptance');
              assert.ok(maxAppendMs<=1000,'A full archive page batch exceeded the one-second card loading target: '+maxAppendMs+'ms');
              assert.ok(latency<=1000,'Initial next card batch took more than one second: '+latency+'ms');
              assert.ok(posterMs<=1000,'Initial next batch WebP posters took more than one second: '+posterMs+'ms');
              } finally {
                await page.close();
              }
            }
          } finally {
            await browser.close();
          }
          NODE
