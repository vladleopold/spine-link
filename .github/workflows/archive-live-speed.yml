# Live benchmark after deploying all-page embedded archive metadata.
name: Spine archive live one-second lazy-card browser proof
on:
  schedule:
    - cron: '43 * * * *'
  workflow_run:
    workflows: ["Vercel deploy and alias"]
    types: [completed]
  workflow_dispatch:
  pull_request:
    paths:
      - api/github-archive.js
      - tests/archive-speed.test.mjs
      - tests/archive-initial-timing.test.mjs
      - scripts/resolve-vercel-preview-comment.mjs
      - scripts/video-motion-audit.mjs
      - tests/video-motion-audit.test.mjs
      - .github/workflows/archive-live-speed.yml
permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read
  statuses: read
concurrency:
  group: spine-archive-live-proof
  cancel-in-progress: false
jobs:
  release_gate:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    outputs:
      deployed: ${{ steps.inspect.outputs.deployed }}
    steps:
      - name: Confirm upstream run performed a real production deployment
        id: inspect
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/jobs?per_page=100")"
          deployed="$(printf '%s' "$jobs" | jq -r '[.jobs[].steps[]? | select(.name == "Deploy to Vercel" and .conclusion == "success")] | length > 0')"
          echo "deployed=$deployed" >> "$GITHUB_OUTPUT"
          echo "REAL_PRODUCTION_DEPLOY=$deployed"
  chromium:
    needs: release_gate
    if: ${{ always() && (github.event_name != 'workflow_run' || needs.release_gate.outputs.deployed == 'true') }}
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    timeout-minutes: 25
    env:
      SITE: https://spine-link.vercel.app
    steps:
      - uses: actions/checkout@v4
      - name: Resolve the ready Vercel preview for this exact PR commit
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { findMatchingVercelProject } from './scripts/resolve-vercel-preview-comment.mjs';

          const token = process.env.GH_TOKEN;
          const repository = process.env.GITHUB_REPOSITORY;
          const pullNumber = process.env.PR_NUMBER;
          const expectedSha = process.env.EXPECTED_SHA;
          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: 'Bearer ' + token,
            'X-GitHub-Api-Version': '2022-11-28',
          };
          async function githubJson(path) {
            const response = await fetch('https://api.github.com' + path, { headers });
            if (!response.ok) throw new Error('GitHub API returned ' + response.status + ' for ' + path);
            return response.json();
          }

          for (let attempt = 0; attempt < 30; attempt += 1) {
            const [comments, statuses] = await Promise.all([
              githubJson('/repos/' + repository + '/issues/' + pullNumber + '/comments?per_page=100'),
              githubJson('/repos/' + repository + '/statuses/' + expectedSha),
            ]);
            const vercelStatus = statuses.find((item) => item.context === 'Vercel');
            const project = findMatchingVercelProject(comments, vercelStatus?.target_url);
            const inspector = project?.inspectorUrl || '';
            const preview = project?.previewUrl || '';
            const deploymentStatus = project?.nextCommitStatus || '';

            if (preview && vercelStatus?.target_url && inspector === vercelStatus.target_url &&
                deploymentStatus === 'DEPLOYED' && vercelStatus.state === 'success') {
              const previewUrl = new URL(preview);
              if (!/^spine-link-git-.*-leopoldus-projects\.vercel\.app$/.test(previewUrl.hostname)) {
                throw new Error('Unexpected Vercel preview host');
              }
              let previewReady = false;
              try {
                const response = await fetch(previewUrl.origin + '/world-spine-archive', {
                  signal: AbortSignal.timeout(20000),
                });
                const html = await response.text();
                previewReady = response.ok && html.includes('data-video-src=') &&
                  html.includes('id="archive-next-page"');
              } catch {}
              if (!previewReady) {
                appendFileSync(process.env.GITHUB_ENV, 'PREVIEW_BLOCKED=PREVIEW_NOT_PUBLIC\n');
                console.warn('VERCEL_PREVIEW_BLOCKED=PREVIEW_NOT_PUBLIC; continuing with production archive audit.');
                process.exit(0);
              }
              appendFileSync(process.env.GITHUB_ENV, 'SITE=' + previewUrl.origin + '\n');
              console.log('VERCEL_PREVIEW_READY=' + previewUrl.origin);
              process.exit(0);
            }
            if (vercelStatus?.state === 'failure' && vercelStatus?.target_url) {
              const failureCode = vercelStatus.target_url.includes('build-rate-limit')
                ? 'BUILD_RATE_LIMIT'
                : 'DEPLOYMENT_FAILED';
              appendFileSync(process.env.GITHUB_ENV, 'PREVIEW_BLOCKED=' + failureCode + '\n');
              console.warn('VERCEL_PREVIEW_BLOCKED=' + failureCode + '; continuing with production archive audit.');
              process.exit(0);
            }
            if (vercelStatus?.target_url && inspector === vercelStatus.target_url && deploymentStatus === 'ERROR') {
              appendFileSync(process.env.GITHUB_ENV, 'PREVIEW_BLOCKED=DEPLOYMENT_FAILED\n');
              console.warn('VERCEL_PREVIEW_BLOCKED=DEPLOYMENT_FAILED; continuing with production archive audit.');
              process.exit(0);
            }
            await new Promise((resolve) => setTimeout(resolve, 10000));
          }
          appendFileSync(process.env.GITHUB_ENV, 'PREVIEW_BLOCKED=PREVIEW_NOT_READY\n');
          console.warn('VERCEL_PREVIEW_BLOCKED=PREVIEW_NOT_READY; continuing with production archive audit.');
          NODE
      - name: Install Playwright
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify poster-first lazy pagination for desktop and mobile
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright';
          import { auditVideoMotion } from './scripts/video-motion-audit.mjs';
          
          const browser=await chromium.launch({headless:true});
          const failures=[];
          try{
            for(const viewport of [{width:1280,height:800},{width:390,height:844}]){
              const failureStart=failures.length;
              const page=await browser.newPage({viewport});
              const pageErrors=[],consoleErrors=[],requestFailures=[],mediaRequests=[],assetHttpErrors=[];
              const posterResponseStatuses=new Map();
              let blockedApiRequests=0,allowedApiRequests=0;
              page.on('pageerror',()=>pageErrors.push(1));
              page.on('console',message=>{if(message.type()==='error')consoleErrors.push(1);});
              page.on('requestfailed',request=>{
                const url=request.url();
                if(/\.(?:webm|webp)(?:\?|$)/i.test(url)||url.includes('/api/github-archive'))requestFailures.push(1);
              });
              page.on('response',response=>{
                const url=response.url();
                if(/\.webp(?:\?|$)/i.test(url))posterResponseStatuses.set(url,response.status());
                if(response.status()>=400&&(/\.(?:webm|webp)(?:\?|$)/i.test(url)||url.includes('/api/github-archive')))
                  assetHttpErrors.push(response.status());
              });
              page.on('request',request=>{
                if(/\.(?:webm|webp)(?:\?|$)/i.test(request.url()))mediaRequests.push({
                  url:request.url(),type:/\.webm(?:\?|$)/i.test(request.url())?'webm':'webp',at:Date.now()
                });
              });
              await page.route(url=>url.pathname==='/api/github-archive'&&url.searchParams.get('feed')==='archive',route=>{
                const requestUrl=new URL(route.request().url());
                const offset=Number(requestUrl.searchParams.get('offset')||0);
                if(offset<40){blockedApiRequests++;return route.abort();}
                allowedApiRequests++;
                return route.continue();
              });
              try{
                const site=(process.env.SITE||'https://spine-link.vercel.app').replace(/\/+$/,'');
                const started=Date.now();
                let response=null;
                try{
                  response=await page.goto(site+'/world-spine-archive',{waitUntil:'domcontentloaded',timeout:45000});
                }catch{
                  failures.push('archive-navigation-failed');
                  continue;
                }
                if(response?.status()!==200){
                  failures.push('archive-page-http');
                  continue;
                }
                const firstHtml=await page.content();
                if(!firstHtml.includes('data-video-src='))failures.push('missing-deferred-video-metadata');
                if(firstHtml.includes('<video src="'))failures.push('eager-webm-in-html');
          
                let initialPosterDecoded=false;
                try{
                  await page.waitForFunction(()=>{
                    const img=document.querySelector('.feed-card img');
                    return img&&img.complete&&img.naturalWidth>0;
                  },{timeout:20000});
                  await page.locator('.feed-card img').first().evaluate(img=>img.decode());
                  initialPosterDecoded=true;
                }catch{}
                const initialPosterMs=Date.now()-started;
                if(!initialPosterDecoded)failures.push('initial-poster-undecoded');
                if(initialPosterMs>1000)failures.push('initial-poster-slow');
                const initialTiming=await page.evaluate(()=>{
                  const nav=performance.getEntriesByType('navigation')[0];
                  const img=document.querySelector('.feed-card img');
                  const resource=img?performance.getEntriesByName(img.currentSrc||img.src)
                    .filter(x=>x.entryType==='resource').at(-1):null;
                  return {
                    responseStartMs:Math.round(nav?.responseStart||0),
                    domContentLoadedMs:Math.round(nav?.domContentLoadedEventEnd||0),
                    posterStartMs:Math.round(resource?.startTime||0),
                    posterEndMs:Math.round(resource?.responseEnd||0),
                    posterTransferBytes:Math.round(resource?.transferSize||0),
                  };
                });
                console.log('ARCHIVE_INITIAL_POSTER_EVIDENCE '+JSON.stringify({
                  viewport:viewport.width,initialMs:initialPosterMs,decoded:initialPosterDecoded,...initialTiming
                }));
                const firstWebp=mediaRequests.find(item=>item.type==='webp');
                const firstWebm=mediaRequests.find(item=>item.type==='webm');
                if(firstWebp&&firstWebm&&firstWebm.at<firstWebp.at)failures.push('initial-video-before-poster');
          
                // Let the one-page-ahead prefetch warm, then walk every public batch.
                await page.waitForTimeout(1900);
                const totalEntries=await page.evaluate(()=>{
                  const raw=document.querySelector('.legend span')?.textContent||'';
                  return Number(raw.match(/\d+/)?.[0]||0);
                });
                if(totalEntries<=0){
                  failures.push('archive-total-missing');
                  continue;
                }
                let allPageBatches=0,paginationComplete=false;
                const appendLatencies=[],posterLatencies=[];
                const batchLimit=Math.ceil(totalEntries/12)+4;
                while(allPageBatches<batchLimit){
                  const sentinel=page.locator('#sentinel');
                  const state=(await sentinel.innerText()).trim();
                  if(state==='End of archive'){paginationComplete=true;break;}
                  const previous=await page.locator('.feed-card').count();
                  const batchStarted=Date.now();
                  await sentinel.scrollIntoViewIfNeeded().catch(()=>{});
                  await sentinel.click({timeout:5000}).catch(()=>{});
                  let waited=false;
                  try{
                    await page.waitForFunction(n=>{
                      const count=document.querySelectorAll('.feed-card').length;
                      const state=document.querySelector('#sentinel')?.textContent?.trim();
                      return count>n||state==='End of archive'||state==='Tap to retry';
                    },previous,{timeout:15000});
                    waited=true;
                  }catch{}
                  let after=await page.locator('.feed-card').count();
                  let nextState=(await sentinel.innerText()).trim();
                  if(waited&&after===previous&&nextState==='Tap to retry'){
                    await sentinel.click({timeout:5000}).catch(()=>{});
                    try{
                      await page.waitForFunction(n=>{
                        const count=document.querySelectorAll('.feed-card').length;
                        const state=document.querySelector('#sentinel')?.textContent?.trim();
                        return count>n||state==='End of archive';
                      },previous,{timeout:15000});
                    }catch{}
                    after=await page.locator('.feed-card').count();
                    nextState=(await sentinel.innerText()).trim();
                  }
                  if(after===previous&&nextState==='End of archive'){
                    paginationComplete=true;
                    break;
                  }
                  if(after===previous){
                    failures.push(waited?'archive-pagination-stalled':'archive-pagination-timeout');
                    break;
                  }
                  const appendMs=Date.now()-batchStarted;
                  appendLatencies.push(appendMs);
                  if(appendMs>1000)failures.push('archive-batch-append-over-one-second');
                  const eagerCount=await page.locator('.feed-card').evaluateAll((cards,start)=>
                    cards.slice(start,start+12).slice(0,6).filter(card=>card.querySelector('img')).length,previous);
                  if(eagerCount>0){
                    const required=Math.min(3,eagerCount);
                    const posterStarted=Date.now();
                    let decoded=false;
                    try{
                      await page.waitForFunction(({start,required})=>{
                        const cards=Array.from(document.querySelectorAll('.feed-card')).slice(start,start+12).slice(0,6);
                        const images=cards.map(card=>card.querySelector('img')).filter(Boolean);
                        return images.filter(img=>img.complete&&img.naturalWidth>0).length>=required;
                      },{start:previous,required},{timeout:5000});
                      decoded=true;
                    }catch{}
                    const posterMs=Date.now()-posterStarted;
                    posterLatencies.push(posterMs);
                    if(!decoded)failures.push('archive-batch-poster-undecoded');
                    if(posterMs>1000)failures.push('archive-batch-poster-over-one-second');
                  }
                  allPageBatches++;
                }
                const sentinelEnd=(await page.locator('#sentinel').innerText()).trim()==='End of archive';
                if(!paginationComplete&&!sentinelEnd)failures.push('archive-not-exhausted');
                const loadedCount=await page.locator('.feed-card').count();
                if(loadedCount!==totalEntries)failures.push('archive-card-count-mismatch');
                if(blockedApiRequests!==0)failures.push('embedded-batch-unexpected-api-request');
                if(totalEntries>40&&allowedApiRequests===0)failures.push('later-archive-api-not-used');
          
                // Decode every poster on desktop; on mobile decode the initial batch and
                // the representative cards immediately before their playback checks.
                const decodeLimit=Number.MAX_SAFE_INTEGER;
                const posterDecode=await page.evaluate(async limit=>{
                  const images=Array.from(document.querySelectorAll('.feed-card img')).slice(0,limit);
                  images.forEach(image=>{image.loading='eager';});
                  let failed=0;
                  for(let start=0;start<images.length;start+=12){
                    const results=await Promise.all(images.slice(start,start+12).map(async image=>{
                      try{await image.decode();return image.naturalWidth>0&&image.naturalHeight>0;}
                      catch{return false;}
                    }));
                    failed+=results.filter(ok=>!ok).length;
                  }
                  return {total:images.length,failed};
                },decodeLimit);
                if(posterDecode.failed>0)failures.push('archive-poster-decode-failed');
          
                const allCards=await page.locator('.feed-card').evaluateAll(cards=>cards.map((card,index)=>{
                  const image=card.querySelector('.feed-media img');
                  return {
                    index,id:card.dataset.entryId||'',
                    sourceWebmStatus:card.dataset.sourceWebmStatus||'',
                    sourcePreviewStatus:card.dataset.sourcePreviewStatus||'',
                    video:card.dataset.videoSrc||'',
                    poster:image?(image.currentSrc||image.getAttribute('src')||''):'',
                    imageCount:card.querySelectorAll('.feed-media img').length,
                    fallback:!!card.querySelector('[data-fallback-src],[data-video-fallback],.feed-placeholder,.media-fallback'),
                    mediaText:(card.querySelector('.feed-media')?.textContent||'').trim(),
                  };
                }));
                if(allCards.length!==totalEntries)failures.push('archive-final-card-count-mismatch');
                const allPairs=allCards.filter(item=>item.video&&item.poster);
                const allMissing=allCards.filter(item=>!item.video||!item.poster);
                const allBlocked=allMissing.filter(item=>!item.video&&!item.poster&&
                  item.sourceWebmStatus.startsWith('blocked-')&&item.sourcePreviewStatus==='blocked');
                const allUnexpectedMissing=allMissing.filter(item=>!allBlocked.includes(item));
                const allInvalidBlocked=allCards.filter(item=>
                  item.sourceWebmStatus.startsWith('blocked-')&&item.sourcePreviewStatus==='blocked'&&
                  (item.video||item.poster));
                const allBadPairs=allCards.filter(item=>{
                  if(!item.video&&!item.poster)return false;
                  if(!item.video||!item.poster||item.imageCount!==1)return true;
                  try{
                    const video=new URL(item.video),poster=new URL(item.poster);
                    const videoName=video.pathname.split('/').pop().toLowerCase();
                    const posterName=poster.pathname.split('/').pop().toLowerCase();
                    return !['preview-medium.webm','preview-low.webm'].includes(videoName)||
                      posterName!==videoName.replace(/\.webm$/,'.webp')||
                      video.pathname.slice(0,video.pathname.lastIndexOf('/')+1)!==
                        poster.pathname.slice(0,poster.pathname.lastIndexOf('/')+1);
                  }catch{return true;}
                });
                const allFallbacks=allCards.filter(item=>item.fallback||item.mediaText);
                if(allUnexpectedMissing.length)failures.push('public-card-missing-without-blocked-status');
                if(allInvalidBlocked.length)failures.push('blocked-card-exposes-partial-media');
                if(allBadPairs.length)failures.push('public-card-webm-webp-pair-mismatch');
                if(allFallbacks.length)failures.push('public-card-has-fallback-content');
          
                const posterStatusTargets=allPairs;
                const posterStatusFailures=posterStatusTargets.filter(item=>
                  ![200,206].includes(posterResponseStatuses.get(item.poster))).length;
                if(posterStatusFailures)failures.push('poster-http-status-failed');
                if(assetHttpErrors.length)failures.push('archive-media-or-api-http-error');
                if(requestFailures.length)failures.push('archive-media-or-api-request-failed');
                if(pageErrors.length)failures.push('archive-javascript-error');
                if(consoleErrors.length)failures.push('archive-console-error');
                if(blockedApiRequests)failures.push('embedded-page-request-was-blocked');
          
                const sampleCount=Math.min(8,allPairs.length);
                if(sampleCount===0)failures.push('archive-has-no-eligible-media');
                const samplePositions=[...new Set(Array.from({length:sampleCount},(_,i)=>
                  Math.round(i*(allPairs.length-1)/Math.max(1,sampleCount-1))))];
                const samples=samplePositions.map(position=>allPairs[position]);
                async function probeWebm(url){
                  try{
                    const response=await fetch(url,{headers:{Range:'bytes=0-63','Cache-Control':'no-cache'},
                      signal:AbortSignal.timeout(20000)});
                    if(![200,206].includes(response.status)){
                      await response.body?.cancel();
                      return {ok:false,status:response.status};
                    }
                    const reader=response.body?.getReader();
                    let prefix=new Uint8Array(0);
                    while(prefix.length<4){
                      const part=await reader.read();
                      if(part.done)break;
                      const next=new Uint8Array(prefix.length+part.value.length);
                      next.set(prefix);next.set(part.value,prefix.length);prefix=next;
                    }
                    await reader?.cancel().catch(()=>{});
                    const type=response.headers.get('content-type')||'';
                    return {ok:prefix.length>=4&&prefix[0]===0x1a&&prefix[1]===0x45&&
                      prefix[2]===0xdf&&prefix[3]===0xa3&&type.includes('video/webm'),status:response.status};
                  }catch{return {ok:false,status:0};}
                }
                const webmTargets=allPairs;
                let webmProbeFailures=0,webmProbed=0;
                for(let start=0;start<webmTargets.length;start+=8){
                  const results=await Promise.all(webmTargets.slice(start,start+8).map(item=>probeWebm(item.video)));
                  webmProbed+=results.length;
                  webmProbeFailures+=results.filter(result=>!result.ok).length;
                }
                if(webmProbeFailures)failures.push('webm-byte-probe-failed');
          
                let playedSamples=0,motionVerifiedSamples=0;
                for(const sample of samples){
                  const card=page.locator('.feed-card').nth(sample.index);
                  let ready=false;
                  try{
                    await card.locator('img').evaluate(async image=>{
                      image.loading='eager';
                      await image.decode();
                    });
                    await card.scrollIntoViewIfNeeded();
                    await page.waitForFunction(index=>{
                      const target=document.querySelectorAll('.feed-card')[index];
                      const video=target?.querySelector('video');
                      return video&&video.readyState>=2&&!video.paused&&video.videoWidth>0;
                    },sample.index,{timeout:15000});
                    ready=true;
                  }catch{}
                  if(!ready){
                    failures.push('sample-video-playback-failed');
                    continue;
                  }
                  const playback=await card.evaluate(element=>{
                    const image=element.querySelector('img');
                    const video=element.querySelector('video');
                    return {posterDecoded:!!image&&image.complete&&image.naturalWidth>0,
                      videoUrl:video?.currentSrc||'',readyState:video?.readyState||0,
                      paused:video?.paused??true,width:video?.videoWidth||0};
                  });
                  if(!(playback.posterDecoded&&playback.videoUrl===sample.video&&
                    playback.readyState>=2&&!playback.paused&&playback.width>0))
                    failures.push('sample-video-frame-not-visible');
                  const posterRequest=mediaRequests.find(request=>request.type==='webp'&&request.url===sample.poster);
                  const videoRequest=mediaRequests.find(request=>request.type==='webm'&&request.url===sample.video);
                  if(!(posterRequest&&videoRequest&&videoRequest.at>=posterRequest.at))
                    failures.push('sample-webm-requested-before-own-poster');
                  if(![200,206].includes(posterResponseStatuses.get(sample.poster)))
                    failures.push('sample-poster-http-status-failed');
                  const motion=await card.locator('video').evaluate(auditVideoMotion,{
                    minDistinctFrames:8,maxFrames:48,timeoutMs:12000
                  }).catch(()=>({ok:false}));
                  if(motion.ok)motionVerifiedSamples++;
                  else failures.push('sample-video-lacks-eight-distinct-motion-frames');
                  playedSamples++;
                }
                console.log('ARCHIVE_ALL_PAGES_EVIDENCE '+JSON.stringify({
                  viewport:viewport.width,previewBlocked:process.env.PREVIEW_BLOCKED||'',totalEntries,loadedCards:allCards.length,batches:allPageBatches,
                  paired:allPairs.length,blocked:allBlocked.length,unexpectedMissing:allUnexpectedMissing.length,
                  decodedPosters:posterDecode.total,posterDecodeFailures:posterDecode.failed,posterStatusFailures,
                  webmProbed,webmProbeFailures,playedSamples,motionVerifiedSamples,maxAppendMs:Math.max(0,...appendLatencies),
                  maxPosterBatchMs:Math.max(0,...posterLatencies),blockedApiRequests,allowedApiRequests,
                  assetHttpErrors:assetHttpErrors.length,requestFailures:requestFailures.length,
                  jsErrors:pageErrors.length,consoleErrors:consoleErrors.length,viewportFailures:failures.length-failureStart
                }));
                if(failures.length>failureStart)
                  console.log('ARCHIVE_AUDIT_FAILURE_CODES '+JSON.stringify(failures.slice(failureStart)));
              }catch{
                failures.push('archive-audit-unexpected-exception');
                console.log('ARCHIVE_AUDIT_EXCEPTION');
              }finally{
                await page.close();
              }
            }
          }finally{
            await browser.close();
          }
          if(process.env.PREVIEW_BLOCKED)failures.push('pr-preview-unavailable');
          assert.equal(failures.length,0,
            'Archive full-library audit failure count: '+failures.length+'; codes='+failures.slice(0,12).join(','));
          NODE
